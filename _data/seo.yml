# Per-language <title> and meta description for each page, plus the Open Graph locale.
# Keys: language code from languages.yml -> og_locale, home/faq/about -> title + description.
en:
  og_locale: en_US
  home:
    title: "kexify — self-custodial MPC crypto wallet, no seed phrase"
