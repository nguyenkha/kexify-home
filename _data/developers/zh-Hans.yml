# Developers page copy. One file per language (same keys); _includes/developers.html renders it.
# Keep it short: one-line intro, at most 2 sentences per item. Only shipped features; planned items say so.
# item.link: faq, cli, cbmpc, pricing (resolved in the include) or a full URL.
title: "面向开发者的 kexify"
intro: "今天就能用 kexify 构建和测试的内容。大部分工具在专家模式中：免费，默认关闭，可在设置中开启。"
more: "详情"

items:
  - icon: link
    title: "通过 WalletConnect 连接 dApp"
    body: "粘贴 dApp 的 WalletConnect URI 或扫描二维码即可配对。支持 EVM 链、Solana 和 TRON，每个请求都会先打开易读的确认页面。"
    link: faq
  - icon: beaker
    title: "测试网"
    body: "Sepolia、Base Sepolia、Solana devnet、TRON Nile、Bitcoin 测试网等。在设置中先开启专家模式，再开启测试网络。"
    link: faq
  - icon: sliders
    title: "专家模式工具"
    body: "自定义 nonce 和手续费、选择 UTXO、RBF 加速、原始消息签名，以及只签名再单独广播。你还可以把任意链指向自己的 RPC。"
    link: faq
  - icon: terminal
    title: "无需服务器的恢复，以及命令行工具"
    body: "有了你的密钥文件和服务器的密钥文件，恢复模式可以在浏览器中签名，完全不需要 kexify 服务器。开源命令行工具可以重建私钥，或在本地响应 WalletConnect 请求。"
    link: cli
  - icon: code
    title: "开源 MPC（cb-mpc）"
    body: "签名使用 Coinbase cb-mpc 的两方 ECDSA 和 EdDSA，通过我们的 MIT 分支。网页应用和命令行工具同样采用 MIT 许可。"
    link: cbmpc
  - icon: api
    title: "开发者 API（即将推出）"
    body: "暂未提供。计划包括：免费的只读 API 用于你自己的钱包，以及 Premium 中的签名 SDK 和 webhook。"
    link: pricing
    more: "查看方案"

quick:
  title: "快速上手：用命令行重建密钥"
  note: "需要 Node.js 和两个密钥文件。不会向任何服务器发送数据。"
