# Developers page copy. One file per language (same keys); _includes/developers.html renders it.
# Keep it short: one-line intro, at most 2 sentences per item. Only shipped features; planned items say so.
# item.link: faq, cli, cbmpc, pricing (resolved in the include) or a full URL.
title: "開発者向け kexify"
intro: "kexify で今日から作れること、試せることです。ほとんどのツールはエキスパートモードにあります。無料で、初期設定はオフ、設定から有効にできます。"
more: "詳しく"

items:
  - icon: link
    title: "WalletConnect で dApp に接続"
    body: "dApp の WalletConnect URI を貼り付けるか、QR コードを読み取ってペアリングします。EVM チェーン、Solana、TRON に対応し、すべてのリクエストで読みやすい確認画面が開きます。"
    link: faq
  - icon: beaker
    title: "テストネット"
    body: "Sepolia、Base Sepolia、Solana devnet、TRON Nile、Bitcoin testnet など。設定でエキスパートモードを有効にし、続けてテストネットワークを有効にします。"
    link: faq
  - icon: sliders
    title: "エキスパートモードのツール"
    body: "nonce と手数料の指定、UTXO の選択、RBF での高速化、生メッセージへの署名、署名のみと別途ブロードキャスト。どのチェーンも自分の RPC に向けられます。"
    link: faq
  - icon: terminal
    title: "サーバーなしの復旧と CLI"
    body: "自分の鍵ファイルとサーバーの鍵ファイルがあれば、復旧モードが kexify のサーバーなしで、対応するすべてのチェーンでブラウザー内から署名・送信します。オープンソースの CLI はアドレスを表示し、鍵をエクスポートし（Bitcoin、Litecoin、Dogecoin は WIF）、WalletConnect のリクエストにローカルで応答します。"
    link: cli
  - icon: code
    title: "オープンソースの MPC（cb-mpc）"
    body: "署名には Coinbase cb-mpc の 2 者間 ECDSA と EdDSA を、MIT ライセンスのフォーク経由で使っています。ウェブアプリと CLI も MIT です。"
    link: cbmpc
  - icon: api
    title: "開発者 API（近日公開）"
    body: "まだ利用できません。自分のウォレット向けの無料の読み取り専用 API と、Premium での署名 SDK と Webhook を予定しています。"
    link: pricing
    more: "プランを見る"

