# डेवलपर पेज की कॉपी (hi)। कुंजियाँ en.yml जैसी ही हैं।
title: "डेवलपर्स के लिए kexify"
intro: "my.kexify.app पर वेब ऐप आज क्या सपोर्ट करता है, और इसे कैसे आज़माएँ। एक्सपर्ट मोड मुफ़्त है और डिफ़ॉल्ट रूप से बंद रहता है: सेटिंग, एक्सपर्ट मोड।"
toc: "इस पेज पर"
planned: "योजना में"

support:
  title: "आज क्या काम करता है"
  rows:
    - name: "WalletConnect v2"
      body: "EVM: <code>eth_sendTransaction</code>, <code>personal_sign</code>, <code>eth_sign</code>, <code>eth_signTypedData_v4</code>. Solana: <code>solana_signTransaction</code>, <code>solana_signAndSendTransaction</code>, <code>solana_signMessage</code>. TRON: <code>tron_signTransaction</code>, <code>tron_signMessage</code>. पेयर करने के लिए URI पेस्ट करें या QR कोड स्कैन करें।"
    - name: "पढ़ने लायक रिव्यू"
      body: "ट्रांसफ़र, <code>approve</code>, Permit2, EIP-2612 permit, <code>setApprovalForAll</code> और ERC-721/1155 का calldata डिकोड किया जाता है। जाने-पहचाने EIP-712 टाइप (Permit, Permit2, DAI permit, EIP-3009) फ़ील्ड-दर-फ़ील्ड दिखाए जाते हैं; अनजाने टाइप को न पढ़ने योग्य के रूप में चिह्नित किया जाता है।"
    - name: "सर्वर की जाँच"
      body: "ऐप या WalletConnect से आने वाले हर रिक्वेस्ट को co-signer पार्स करता है। असीमित fungible approval (2^128 या उससे ज़्यादा, या अधिकतम मान) अस्वीकार कर दिए जाते हैं; रिव्यू में सीमा तय करें। फ़्लैग किए गए पते (GoPlus) अस्वीकार कर दिए जाते हैं। आपकी दैनिक सीमा और भरोसेमंद सूची लागू रहती है।"
    - name: "टेस्ट नेटवर्क"
      body: "Ethereum Sepolia, Base Sepolia, Solana devnet और testnet, TRON Nile और Shasta, Bitcoin और Litecoin testnet, XRP, Stellar, TON और Algorand के testnet, Cardano PreProd। इन्हें सेटिंग में चालू करें (आज एक्सपर्ट मोड के साथ)।"
    - name: "एक्सपर्ट मोड"
      body: "EVM पर nonce, gas limit और फ़ीस ओवरराइड; BTC, LTC और BCH पर fee rate और मैन्युअल UTXO चयन; BTC और LTC पर RBF और speed-up; रॉ मैसेज साइनिंग; sign-only और अलग broadcast पेज; WalletConnect approval में पूरा calldata; कस्टम पॉलिसी रूल एडिटर।"
    - name: "आपका अपना RPC"
      body: "लिस्ट की किसी भी चेन का RPC और explorer URL बदलें (health check सहित), या पूरे नेटवर्क कॉन्फ़िग को JSON के रूप में एडिट और एक्सपोर्ट करें। बिल्कुल नया नेटवर्क जोड़ना अभी सपोर्ट नहीं है।"
    - name: "कस्टम टोकन"
      body: "EVM चेन, Solana, Stellar, TRON, Algorand और TON पर कॉन्ट्रैक्ट पते से टोकन जोड़ें (डिस्प्ले संभालें, कस्टम टोकन जोड़ें)।"
    - name: "सर्वर के बिना बाहर निकलें"
      body: "रिकवरी मोड आपकी की फ़ाइल और सर्वर की की फ़ाइल लोड करता है और दोनों MPC पार्टियों को ब्राउज़र में चलाता है, kexify सर्वर को कोई कॉल किए बिना। सर्वर की फ़ाइल एक्सपर्ट मोड में माँगी जाती है और सुरक्षा प्रतीक्षा के बाद खुलती है।"
    - name: "CLI"
      body: "ओपन-सोर्स रेपो में <code>frontend/cli.ts</code>, एक Bun प्रोग्राम। <code>recover</code> दोनों की फ़ाइलों से private key (hex, या Bitcoin के लिए WIF) दोबारा बनाता है और पते प्रिंट करता है। <code>connect</code> WalletConnect रिक्वेस्ट का जवाब लोकल 2-पार्टी साइनिंग से देता है।"
    - name: "ओपन सोर्स"
      body: 'वेब ऐप और CLI: <a href="https://github.com/nguyenkha/kexify-web">nguyenkha/kexify-web</a> (MIT)। MPC लाइब्रेरी: <a href="https://github.com/nguyenkha/cb-mpc">nguyenkha/cb-mpc</a>, <a href="https://github.com/coinbase/cb-mpc">Coinbase cb-mpc</a> का फ़ोर्क (MIT)। API सर्वर, MPC सर्वर और iPhone ऐप अभी ओपन सोर्स नहीं हैं।'

mpc:
  title: "MPC नोट्स"
  items:
    - "दो पार्टियाँ: आपका डिवाइस और kexify MPC सर्वर। secp256k1 पर 2-पार्टी ECDSA (EVM, Bitcoin परिवार, TRON, XRP) और Ed25519 पर 2-पार्टी EdDSA (Solana, Stellar, TON, Algorand, Cardano)।"
    - "की distributed key generation से बनती हैं। पूरी private key कभी मौजूद नहीं होती, जब तक आप खुद दोनों की फ़ाइलों से उसे दोबारा न बनाएँ।"
    - "सिग्नेचर सामान्य ECDSA या Ed25519 सिग्नेचर होते हैं। कोई भी स्टैंडर्ड लाइब्रेरी उन्हें वेरिफ़ाई कर लेती है; on-chain कुछ भी नहीं दिखाता कि MPC इस्तेमाल हुआ।"
    - "प्रोटोकॉल वर्ज़न वाला है: हर क्लाइंट <code>X-Kexify-Client</code> हेडर में अपना MPC प्रोटोकॉल (<code>mpc=2p:1</code>) बताता है, और जिन क्लाइंट को सर्वर अब सर्व नहीं कर सकता उन्हें HTTP 426 के साथ अस्वीकार कर देता है।"
    - "ब्राउज़र में cb-mpc WebAssembly के रूप में चलता है। आपका शेयर आपकी passkey (WebAuthn PRF) या पासफ़्रेज़ से एन्क्रिप्ट होता है; सर्वर का शेयर हर यूज़र की अलग की से एन्क्रिप्ट होता है।"

quick:
  title: "क्विक स्टार्ट"
  items:
    - title: "dApp कनेक्ट करें"
      steps:
        - "my.kexify.app खोलें और अपना वॉलेट बनाएँ या अनलॉक करें।"
        - "dApp में WalletConnect चुनें और pairing URI कॉपी करें (या QR कोड दिखाएँ)।"
        - "kexify में WalletConnect खोलें, URI पेस्ट करें या कोड स्कैन करें, अकाउंट चुनें और approve करें।"
        - "हर रिक्वेस्ट पर एक रिव्यू खुलता है। उसे जाँचें, कन्फ़र्म करें (passkey या पासफ़्रेज़), और डिवाइस व सर्वर मिलकर साइन करते हैं।"
    - title: "टेस्ट नेटवर्क इस्तेमाल करें"
      steps:
        - "सेटिंग में एक्सपर्ट मोड चालू करें, फिर टेस्ट नेटवर्क चालू करें।"
        - "अब टेस्ट नेटवर्क आपके वॉलेट में दिखते हैं। EVM चेन पर आपका टेस्ट पता वही रहता है जो आपका mainnet पता है।"
        - "उस नेटवर्क के faucet से टेस्ट कॉइन लें, फिर भेजें, या testnet पर चलने वाला dApp कनेक्ट करें।"
    - title: "सिग्नेचर वेरिफ़ाई करें"
      intro: "WalletConnect के ज़रिए किसी dApp से <code>personal_sign</code> से मैसेज साइन करें, फिर किसी भी लाइब्रेरी से जाँचें। viem के साथ:"
      code: |
        import { verifyMessage } from "viem";

        const ok = await verifyMessage({
          address: "0xYourKexifyAddress",
          message: "hello kexify",
          signature: "0x...", // returned by personal_sign
        });
        console.log(ok); // true
      after: "यह किसी भी दूसरे वॉलेट के सिग्नेचर की तरह वेरिफ़ाई होता है, क्योंकि यह EIP-191 मैसेज हैश पर एक स्टैंडर्ड secp256k1 सिग्नेचर है।"

api:
  title: "डेवलपर API (जल्द आ रहा है)"
  intro: "अभी उपलब्ध नहीं है। योजना में यह है:"
  items:
    - "आपके अपने वॉलेट के लिए रीड-ओनली API: फ़्री।"
    - "एक ऑटोमेशन वॉलेट का साइनिंग SDK: Premium।"
    - "वेबहुक: Premium।"

