# Developers page copy. One file per language (same keys); _includes/developers.html renders it.
# Keep it short: one-line intro, at most 2 sentences per item. Only shipped features; planned items say so.
# item.link: faq, cli, cbmpc, pricing (resolved in the include) or a full URL.
title: "डेवलपर्स के लिए kexify"
intro: "आज kexify के साथ आप क्या बना और टेस्ट कर सकते हैं। ज़्यादातर टूल एक्सपर्ट मोड में हैं: मुफ़्त, डिफ़ॉल्ट रूप से बंद, सेटिंग में चालू करें।"
more: "विवरण"

items:
  - icon: link
    title: "WalletConnect से dApp जोड़ें"
    body: "dApp का WalletConnect URI पेस्ट करके या QR कोड स्कैन करके जोड़ें। यह EVM चेन, Solana और TRON पर काम करता है, और हर अनुरोध पहले एक आसान समीक्षा खोलता है।"
    link: faq
  - icon: beaker
    title: "टेस्टनेट"
    body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile, Bitcoin testnet और कई अन्य। सेटिंग में एक्सपर्ट मोड चालू करें, फिर टेस्ट नेटवर्क चालू करें।"
    link: faq
  - icon: sliders
    title: "एक्सपर्ट मोड के टूल"
    body: "nonce और फ़ीस खुद तय करें, UTXO चुनें, RBF से तेज़ करें, रॉ मैसेज साइन करें, और सिर्फ़ साइन करके अलग से ब्रॉडकास्ट करें। आप किसी भी चेन को अपने RPC पर भी चला सकते हैं।"
    link: faq
  - icon: terminal
    title: "सर्वर के बिना रिकवरी, और CLI"
    body: "आपकी की फ़ाइल और सर्वर की की फ़ाइल हो, तो रिकवरी मोड बिना किसी kexify सर्वर के ब्राउज़र में ही साइन करता है। ओपन-सोर्स CLI प्राइवेट की दोबारा बना सकता है या WalletConnect अनुरोधों का जवाब लोकल रूप से दे सकता है।"
    link: cli
  - icon: code
    title: "ओपन-सोर्स MPC (cb-mpc)"
    body: "साइनिंग में Coinbase cb-mpc का 2-पक्षीय ECDSA और EdDSA हमारे MIT फ़ोर्क के ज़रिए इस्तेमाल होता है। वेब ऐप और CLI भी MIT हैं।"
    link: cbmpc
  - icon: api
    title: "डेवलपर API (जल्द आ रहा है)"
    body: "अभी उपलब्ध नहीं है। योजना: आपके अपने वॉलेट के लिए मुफ़्त रीड-ओनली API, और Premium में साइनिंग SDK और वेबहुक।"
    link: pricing
    more: "प्लान देखें"

quick:
  title: "क्विक स्टार्ट: CLI से अपनी की दोबारा बनाएँ"
  note: "Node.js और दोनों की फ़ाइलें चाहिए। किसी सर्वर पर कुछ नहीं भेजा जाता।"
