# Developers page copy. One file per language (same keys); _includes/developers.html renders it.
# Keep it short: one-line intro, at most 2 sentences per item. Only shipped features; planned items say so.
# item.link: faq, cli, cbmpc, pricing (resolved in the include) or a full URL.
title: "kexify for developers"
intro: "What you can build and test with kexify today. Most tools sit in Expert mode: free, off by default, in Settings."
more: "Details"

items:
  - icon: link
    title: "Connect dApps with WalletConnect"
    body: "Pair a dApp by pasting its WalletConnect URI or scanning the QR code. Works with EVM chains, Solana and TRON, and every request opens a readable review."
    link: faq
  - icon: beaker
    title: "Testnets"
    body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile, Bitcoin testnet and more. Turn on Expert mode, then test networks, in Settings."
    link: faq
  - icon: sliders
    title: "Expert mode tools"
    body: "Nonce and fee overrides, UTXO selection, RBF speed-up, raw message signing and sign-only with a separate broadcast. You can also point any chain at your own RPC."
    link: faq
  - icon: terminal
    title: "Recovery without the server, and the CLI"
    body: "With your key file and the server's key file, recovery mode signs in your browser with no kexify server. The open-source CLI can rebuild the private key or answer WalletConnect requests locally."
    link: cli
  - icon: code
    title: "Open-source MPC (cb-mpc)"
    body: "Signing uses 2-party ECDSA and EdDSA from Coinbase cb-mpc, through our MIT fork. The web app and the CLI are MIT too."
    link: cbmpc
  - icon: api
    title: "Developer API (coming soon)"
    body: "Not available yet. Planned: a free read-only API for your own wallets, and a signing SDK and webhooks on Premium."
    link: pricing
    more: "See plans"

quick:
  title: "Quick start: rebuild your key with the CLI"
  note: "Needs Node.js and both key files. Nothing is sent to any server."
