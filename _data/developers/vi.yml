# Developers page copy. One file per language (same keys); _includes/developers.html renders it.
# Keep it short: one-line intro, at most 2 sentences per item. Only shipped features; planned items say so.
# item.link: faq, cli, cbmpc, pricing (resolved in the include) or a full URL.
title: "kexify cho nhà phát triển"
intro: "Những gì bạn có thể xây và thử với kexify ngay hôm nay. Phần lớn công cụ nằm trong Chế độ chuyên gia: miễn phí, mặc định tắt, bật trong Cài đặt."
more: "Chi tiết"

items:
  - icon: link
    title: "Kết nối dApp qua WalletConnect"
    body: "Ghép nối dApp bằng cách dán URI WalletConnect hoặc quét mã QR. Hỗ trợ các chain EVM, Solana và TRON, và mỗi yêu cầu đều mở màn hình xem lại dễ đọc."
    link: faq
  - icon: beaker
    title: "Testnet"
    body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile, Bitcoin testnet và nhiều mạng khác. Bật Chế độ chuyên gia, rồi bật mạng thử nghiệm trong Cài đặt."
    link: faq
  - icon: sliders
    title: "Công cụ Chế độ chuyên gia"
    body: "Tự đặt nonce và phí, chọn UTXO, tăng tốc RBF, ký thông điệp thô và chỉ ký rồi broadcast riêng. Bạn cũng có thể trỏ bất kỳ chain nào sang RPC của riêng mình."
    link: faq
  - icon: terminal
    title: "Khôi phục không cần server, và CLI"
    body: "Có file khoá của bạn và file khoá của server, chế độ khôi phục ký ngay trong trình duyệt mà không cần server kexify. CLI mã nguồn mở có thể dựng lại khoá riêng tư hoặc trả lời yêu cầu WalletConnect ngay trên máy."
    link: cli
  - icon: code
    title: "MPC mã nguồn mở (cb-mpc)"
    body: "Việc ký dùng ECDSA và EdDSA 2 bên từ Coinbase cb-mpc, qua bản fork MIT của chúng tôi. Ứng dụng web và CLI cũng là MIT."
    link: cbmpc
  - icon: api
    title: "API cho nhà phát triển (sắp ra mắt)"
    body: "Chưa có. Dự kiến: API chỉ đọc miễn phí cho ví của bạn, cùng SDK ký và webhook trong gói Premium."
    link: pricing
    more: "Xem các gói"

quick:
  title: "Bắt đầu nhanh: dựng lại khoá bằng CLI"
  note: "Cần Node.js và cả hai file khoá. Không gửi gì lên server nào."
