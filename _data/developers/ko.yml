# Developers page copy. One file per language (same keys); _includes/developers.html renders it.
# Keep it short: one-line intro, at most 2 sentences per item. Only shipped features; planned items say so.
# item.link: faq, cli, cbmpc, pricing (resolved in the include) or a full URL.
title: "개발자를 위한 kexify"
intro: "지금 kexify로 만들고 테스트할 수 있는 것들입니다. 대부분의 도구는 전문가 모드에 있습니다. 무료이고 기본값은 꺼짐이며 설정에서 켭니다."
more: "자세히"

items:
  - icon: link
    title: "WalletConnect로 dApp 연결"
    body: "dApp의 WalletConnect URI를 붙여 넣거나 QR 코드를 스캔해 연결합니다. EVM 체인, Solana, TRON에서 동작하며 모든 요청은 읽기 쉬운 확인 화면부터 엽니다."
    link: faq
  - icon: beaker
    title: "테스트넷"
    body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile, Bitcoin testnet 등을 지원합니다. 설정에서 전문가 모드를 켠 뒤 테스트 네트워크를 켜세요."
    link: faq
  - icon: sliders
    title: "전문가 모드 도구"
    body: "nonce와 수수료 직접 지정, UTXO 선택, RBF 가속, 원시 메시지 서명, 서명만 하고 따로 브로드캐스트하기를 지원합니다. 어떤 체인이든 직접 운영하는 RPC로 바꿀 수도 있습니다."
    link: faq
  - icon: terminal
    title: "서버 없이 복구, 그리고 CLI"
    body: "내 키 파일과 서버 키 파일이 있으면 복구 모드가 kexify 서버 없이 지원되는 모든 체인에서 브라우저로 서명하고 전송합니다. 오픈소스 CLI는 주소를 출력하고 키를 내보내며(Bitcoin, Litecoin, Dogecoin은 WIF) WalletConnect 요청에 로컬에서 응답합니다."
    link: cli
  - icon: code
    title: "오픈소스 MPC (cb-mpc)"
    body: "서명에는 Coinbase cb-mpc의 2자 ECDSA와 EdDSA를 MIT 포크를 통해 사용합니다. 웹 앱과 CLI도 MIT입니다."
    link: cbmpc
  - icon: api
    title: "개발자 API (곧 출시)"
    body: "아직 사용할 수 없습니다. 내 지갑용 무료 읽기 전용 API와 Premium의 서명 SDK, 웹훅을 계획하고 있습니다."
    link: pricing
    more: "요금제 보기"

