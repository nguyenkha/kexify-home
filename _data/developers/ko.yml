# 개발자 페이지 문구(한국어). 키는 en.yml과 같습니다.
title: "개발자를 위한 kexify"
intro: "my.kexify.app 웹 앱이 현재 지원하는 기능과 사용해 보는 방법입니다. 전문가 모드는 무료이며 기본값은 꺼짐입니다. 설정, 전문가 모드에서 켭니다."
toc: "이 페이지의 내용"
planned: "예정"

support:
  title: "지금 가능한 기능"
  rows:
    - name: "WalletConnect v2"
      body: "EVM: <code>eth_sendTransaction</code>, <code>personal_sign</code>, <code>eth_sign</code>, <code>eth_signTypedData_v4</code>. Solana: <code>solana_signTransaction</code>, <code>solana_signAndSendTransaction</code>, <code>solana_signMessage</code>. TRON: <code>tron_signTransaction</code>, <code>tron_signMessage</code>. URI를 붙여넣거나 QR 코드를 스캔해 페어링합니다."
    - name: "읽기 쉬운 검토 화면"
      body: "전송, <code>approve</code>, Permit2, EIP-2612 permit, <code>setApprovalForAll</code>, ERC-721/1155의 calldata를 디코딩해 보여 줍니다. 알려진 EIP-712 타입(Permit, Permit2, DAI permit, EIP-3009)은 필드별로 표시하고, 알 수 없는 타입은 해석 불가로 표시합니다."
    - name: "서버 검사"
      body: "앱이나 WalletConnect에서 오는 모든 요청은 공동 서명 측에서 분석합니다. 무제한 fungible 토큰 승인(2^128 이상 또는 최댓값)은 거부되므로 검토 화면에서 한도를 지정해야 합니다. 플래그가 지정된 주소(GoPlus)는 거부됩니다. 일일 한도와 신뢰 목록도 그대로 적용됩니다."
    - name: "테스트 네트워크"
      body: "Ethereum Sepolia, Base Sepolia, Solana devnet과 testnet, TRON Nile과 Shasta, Bitcoin과 Litecoin testnet, XRP, Stellar, TON, Algorand 테스트넷, Cardano PreProd. 설정에서 켭니다(현재는 전문가 모드 필요)."
    - name: "전문가 모드"
      body: "EVM에서 nonce, gas limit, 수수료 직접 지정. BTC, LTC, BCH에서 수수료율 지정과 UTXO 수동 선택. BTC와 LTC에서 RBF 및 가속. 원시 메시지 서명. 서명만 하기와 별도의 브로드캐스트 페이지. WalletConnect 승인 화면에서 calldata 전체 표시. 사용자 정의 정책 규칙 편집기."
    - name: "자체 RPC"
      body: "목록에 있는 체인의 RPC와 익스플로러 URL을 바꿀 수 있고(상태 확인 포함), 네트워크 설정 전체를 JSON으로 편집하고 내보낼 수도 있습니다. 완전히 새로운 네트워크 추가는 아직 지원하지 않습니다."
    - name: "사용자 정의 토큰"
      body: "EVM 체인, Solana, Stellar, TRON, Algorand, TON에서 컨트랙트 주소로 토큰을 추가할 수 있습니다(표시 관리, 사용자 지정 토큰 추가)."
    - name: "서버 없이 떠나기"
      body: "복구 모드는 내 키 파일과 서버의 키 파일을 불러와 MPC 양쪽 당사자를 브라우저 안에서 실행하며, kexify 서버를 전혀 호출하지 않습니다. 서버 파일은 전문가 모드에서 요청하고, 안전 대기 시간이 지나면 잠금이 풀립니다."
    - name: "CLI"
      body: "오픈소스 저장소의 <code>frontend/cli.ts</code>이며 Bun 프로그램입니다. <code>recover</code>는 두 키 파일로 개인 키(16진수, Bitcoin은 WIF)를 복원하고 주소를 출력합니다. <code>connect</code>는 로컬 2자 서명으로 WalletConnect 요청에 응답합니다."
    - name: "오픈소스"
      body: '웹 앱과 CLI: <a href="https://github.com/nguyenkha/kexify-web">nguyenkha/kexify-web</a> (MIT). MPC 라이브러리: <a href="https://github.com/nguyenkha/cb-mpc">nguyenkha/cb-mpc</a>, <a href="https://github.com/coinbase/cb-mpc">Coinbase cb-mpc</a>의 포크 (MIT). API 서버, MPC 서버, iPhone 앱은 아직 오픈소스가 아닙니다.'

mpc:
  title: "MPC 참고 사항"
  items:
    - "당사자는 둘입니다. 내 기기와 kexify MPC 서버입니다. secp256k1에서는 2자 ECDSA(EVM, Bitcoin 계열, TRON, XRP), Ed25519에서는 2자 EdDSA(Solana, Stellar, TON, Algorand, Cardano)를 사용합니다."
    - "키는 분산 키 생성으로 만들어집니다. 두 키 파일로 직접 복원하지 않는 한 완전한 개인 키는 존재하지 않습니다."
    - "서명은 일반적인 ECDSA 또는 Ed25519 서명입니다. 표준 라이브러리로 모두 검증할 수 있으며, 온체인에서는 MPC가 사용되었다는 흔적이 전혀 보이지 않습니다."
    - "프로토콜에는 버전이 있습니다. 모든 클라이언트는 <code>X-Kexify-Client</code> 헤더에 자신의 MPC 프로토콜(<code>mpc=2p:1</code>)을 명시하고, 서버는 더 이상 지원할 수 없는 클라이언트를 HTTP 426으로 거부합니다."
    - "브라우저에서는 cb-mpc가 WebAssembly로 실행됩니다. 내 쪽 키 조각은 패스키(WebAuthn PRF) 또는 암호문(passphrase)으로 암호화되고, 서버 쪽 키 조각은 사용자별 키로 암호화됩니다."

quick:
  title: "빠른 시작"
  items:
    - title: "dApp 연결하기"
      steps:
        - "my.kexify.app을 열고 지갑을 만들거나 잠금을 해제합니다."
        - "dApp에서 WalletConnect를 선택하고 페어링 URI를 복사합니다(또는 QR 코드를 표시합니다)."
        - "kexify에서 WalletConnect를 열고 URI를 붙여넣거나 코드를 스캔한 뒤 계정을 선택하고 승인합니다."
        - "요청마다 검토 화면이 열립니다. 내용을 확인하고 패스키 또는 암호문으로 승인하면 기기와 서버가 함께 서명합니다."
    - title: "테스트 네트워크 사용하기"
      steps:
        - "설정에서 전문가 모드를 켠 다음 테스트 네트워크를 켭니다."
        - "이제 지갑에 테스트 네트워크가 표시됩니다. EVM 체인에서는 테스트 주소가 메인넷 주소와 같습니다."
        - "해당 네트워크의 faucet에서 테스트 코인을 받아 전송하거나, 테스트넷에서 동작하는 dApp을 연결합니다."
    - title: "서명 검증하기"
      intro: "dApp에서 WalletConnect로 <code>personal_sign</code>을 사용해 메시지에 서명한 뒤, 아무 라이브러리로나 검증합니다. viem 예시입니다."
      code: |
        import { verifyMessage } from "viem";

        const ok = await verifyMessage({
          address: "0xYourKexifyAddress",
          message: "hello kexify",
          signature: "0x...", // returned by personal_sign
        });
        console.log(ok); // true
      after: "EIP-191 메시지 해시에 대한 표준 secp256k1 서명이므로, 다른 지갑의 서명과 똑같이 검증됩니다."

api:
  title: "개발자 API (곧 출시)"
