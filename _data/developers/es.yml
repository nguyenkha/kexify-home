# Developers page copy. One file per language (same keys); _includes/developers.html renders it.
# Keep it short: one-line intro, at most 2 sentences per item. Only shipped features; planned items say so.
# item.link: faq, cli, cbmpc, pricing (resolved in the include) or a full URL.
title: "kexify para desarrolladores"
intro: "Lo que puedes construir y probar con kexify hoy. Casi todo está en el modo experto: gratis, desactivado por defecto, en Ajustes."
more: "Detalles"

items:
  - icon: link
    title: "Conecta dApps con WalletConnect"
    body: "Empareja una dApp pegando su URI de WalletConnect o escaneando el código QR. Funciona con cadenas EVM, Solana y TRON, y cada solicitud abre una revisión fácil de leer."
    link: faq
  - icon: beaker
    title: "Redes de prueba"
    body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile, Bitcoin testnet y más. Activa el modo experto y luego las redes de prueba en Ajustes."
    link: faq
  - icon: sliders
    title: "Herramientas del modo experto"
    body: "Nonce y comisiones a mano, selección de UTXO, aceleración RBF, firma de mensajes en bruto y firmar sin enviar con difusión aparte. También puedes usar tu propio RPC en cualquier cadena."
    link: faq
  - icon: terminal
    title: "Recuperación sin el servidor, y la CLI"
    body: "Con tu archivo de clave y el del servidor, el modo de recuperación firma y envía desde tu navegador en todas las cadenas compatibles, sin ningún servidor de kexify. La CLI de código abierto muestra tus direcciones, exporta tus claves (WIF para Bitcoin, Litecoin y Dogecoin) y responde solicitudes de WalletConnect en local."
    link: cli
  - icon: code
    title: "MPC de código abierto (cb-mpc)"
    body: "La firma usa ECDSA y EdDSA de 2 partes de Coinbase cb-mpc, a través de nuestro fork MIT. La app web y la CLI también son MIT."
    link: cbmpc
  - icon: api
    title: "API para desarrolladores (próximamente)"
    body: "Todavía no está disponible. Previsto: una API de solo lectura gratis para tus propias billeteras. En Premium: propuestas por API que apruebas en tu iPhone, y webhooks. La firma automática llegará más adelante, para equipos."
    link: pricing
    more: "Ver planes"

