# Developers page copy. One file per language (same keys); _includes/developers.html renders it.
# Keep it short: one-line intro, at most 2 sentences per item. Only shipped features; planned items say so.
# item.link: faq, cli, cbmpc, pricing (resolved in the include) or a full URL.
title: "kexify สำหรับนักพัฒนา"
intro: "สิ่งที่คุณสร้างและทดสอบกับ kexify ได้วันนี้ เครื่องมือส่วนใหญ่อยู่ในโหมดผู้เชี่ยวชาญ ใช้ฟรี ปิดไว้เป็นค่าเริ่มต้น เปิดได้ในการตั้งค่า"
more: "รายละเอียด"

items:
  - icon: link
    title: "เชื่อมต่อ dApp ด้วย WalletConnect"
    body: "จับคู่ dApp โดยวาง URI ของ WalletConnect หรือสแกน QR code ใช้ได้กับเชน EVM, Solana และ TRON และทุกคำขอจะเปิดหน้าตรวจสอบที่อ่านเข้าใจง่าย"
    link: faq
  - icon: beaker
    title: "เทสต์เน็ต"
    body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile, Bitcoin testnet และอื่น ๆ เปิดโหมดผู้เชี่ยวชาญ แล้วเปิดเครือข่ายทดสอบในการตั้งค่า"
    link: faq
  - icon: sliders
    title: "เครื่องมือในโหมดผู้เชี่ยวชาญ"
    body: "กำหนด nonce และค่าธรรมเนียมเอง เลือก UTXO เร่งธุรกรรมด้วย RBF ลงนามข้อความดิบ และลงนามอย่างเดียวแล้วส่งแยก คุณยังตั้ง RPC ของตัวเองให้เชนใดก็ได้"
    link: faq
  - icon: terminal
    title: "กู้คืนโดยไม่ต้องใช้เซิร์ฟเวอร์ และ CLI"
    body: "เมื่อมีไฟล์คีย์ของคุณและไฟล์คีย์ของเซิร์ฟเวอร์ โหมดกู้คืนจะลงนามและส่งในเบราว์เซอร์บนทุกเชนที่รองรับ โดยไม่ต้องใช้เซิร์ฟเวอร์ kexify CLI โอเพนซอร์สแสดงที่อยู่ของคุณ ส่งออกคีย์ของคุณ (WIF สำหรับ Bitcoin, Litecoin และ Dogecoin) และตอบคำขอ WalletConnect บนเครื่องของคุณได้"
    link: cli
  - icon: code
    title: "MPC โอเพนซอร์ส (cb-mpc)"
    body: "การลงนามใช้ ECDSA และ EdDSA แบบ 2 ฝ่ายจาก Coinbase cb-mpc ผ่าน fork ของเราที่เป็น MIT เว็บแอปและ CLI ก็เป็น MIT เช่นกัน"
    link: cbmpc
  - icon: api
    title: "API สำหรับนักพัฒนา (เร็ว ๆ นี้)"
    body: "ยังไม่เปิดให้ใช้ ที่วางแผนไว้คือ API แบบอ่านอย่างเดียวฟรีสำหรับวอลเล็ตของคุณ ส่วนใน Premium คือข้อเสนอผ่าน API ที่คุณอนุมัติบน iPhone และ webhook การลงนามอัตโนมัติจะมาทีหลัง สำหรับทีม"
    link: pricing
    more: "ดูแพ็กเกจ"

