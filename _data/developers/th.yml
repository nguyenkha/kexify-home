    - "ดูตัวอย่างยอดคงเหลือที่เปลี่ยนก่อนลงนาม"
    - "เครือข่ายทดสอบเป็นการตั้งค่าปกติ โดยไม่ต้องใช้โหมดผู้เชี่ยวชาญ"
