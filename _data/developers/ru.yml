# Developers page copy. One file per language (same keys); _includes/developers.html renders it.
# Keep it short: one-line intro, at most 2 sentences per item. Only shipped features; planned items say so.
# item.link: faq, cli, cbmpc, pricing (resolved in the include) or a full URL.
title: "kexify для разработчиков"
intro: "Что можно собрать и проверить с kexify уже сегодня. Большинство инструментов в режиме эксперта: бесплатно, по умолчанию выключен, включается в Настройках."
more: "Подробнее"

items:
  - icon: link
    title: "Подключение dApp через WalletConnect"
    body: "Свяжите dApp, вставив URI WalletConnect или отсканировав QR-код. Работает с сетями EVM, Solana и TRON, и каждый запрос сначала открывает понятный экран проверки."
    link: faq
  - icon: beaker
    title: "Тестовые сети"
    body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile, Bitcoin testnet и другие. Включите режим эксперта, а затем тестовые сети в Настройках."
    link: faq
  - icon: sliders
    title: "Инструменты режима эксперта"
    body: "Свои nonce и комиссия, выбор UTXO, ускорение через RBF, подпись сырых сообщений и подпись без отправки с отдельной рассылкой. Для любой сети можно указать свой RPC."
    link: faq
  - icon: terminal
    title: "Восстановление без сервера и CLI"
    body: "С вашим файлом ключа и файлом ключа сервера режим восстановления подписывает прямо в браузере, без серверов kexify. Открытый CLI может восстановить приватный ключ или отвечать на запросы WalletConnect локально."
    link: cli
  - icon: code
    title: "Открытый MPC (cb-mpc)"
    body: "Подпись использует двусторонние ECDSA и EdDSA из Coinbase cb-mpc через наш форк под MIT. Веб-приложение и CLI тоже под MIT."
    link: cbmpc
  - icon: api
    title: "API для разработчиков (скоро)"
    body: "Пока недоступно. В планах: бесплатный API только для чтения для ваших кошельков, а также SDK для подписи и вебхуки в Premium."
    link: pricing
    more: "Тарифы"

quick:
  title: "Быстрый старт: восстановите ключ через CLI"
  note: "Нужны Node.js и оба файла ключа. Ничего не отправляется ни на какой сервер."
