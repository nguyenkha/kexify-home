# Developers page copy. One file per language (same keys); _includes/developers.html renders it.
# Keep it short: one-line intro, at most 2 sentences per item. Only shipped features; planned items say so.
# item.link: faq, cli, cbmpc, pricing (resolved in the include) or a full URL.
title: "kexify para desenvolvedores"
intro: "O que você pode construir e testar com o kexify hoje. A maioria das ferramentas fica no modo especialista: gratuito, desativado por padrão, em Ajustes."
more: "Detalhes"

items:
  - icon: link
    title: "Conecte dApps com WalletConnect"
    body: "Pareie um dApp colando a URI do WalletConnect ou lendo o QR code. Funciona com redes EVM, Solana e TRON, e cada pedido abre uma revisão fácil de ler."
    link: faq
  - icon: beaker
    title: "Redes de teste"
    body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile, Bitcoin testnet e outras. Ative o modo especialista e depois as redes de teste em Ajustes."
    link: faq
  - icon: sliders
    title: "Ferramentas do modo especialista"
    body: "Nonce e taxas manuais, seleção de UTXO, aceleração RBF, assinatura de mensagens brutas e só assinar com transmissão separada. Você também pode usar seu próprio RPC em qualquer rede."
    link: faq
  - icon: terminal
    title: "Recuperação sem o servidor, e a CLI"
    body: "Com o seu arquivo de chave e o do servidor, o modo de recuperação assina no navegador sem nenhum servidor do kexify. A CLI de código aberto reconstrói a chave privada ou responde pedidos do WalletConnect localmente."
    link: cli
  - icon: code
    title: "MPC de código aberto (cb-mpc)"
    body: "A assinatura usa ECDSA e EdDSA de 2 partes do Coinbase cb-mpc, através do nosso fork MIT. O app web e a CLI também são MIT."
    link: cbmpc
  - icon: api
    title: "API para desenvolvedores (em breve)"
    body: "Ainda não disponível. Previsto: uma API somente leitura gratuita para suas carteiras, e um SDK de assinatura e webhooks no Premium."
    link: pricing
    more: "Ver planos"

quick:
  title: "Início rápido: reconstrua sua chave com a CLI"
  note: "Precisa de Node.js e dos dois arquivos de chave. Nada é enviado a nenhum servidor."
