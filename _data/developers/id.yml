# Developers page copy. One file per language (same keys); _includes/developers.html renders it.
# Keep it short: one-line intro, at most 2 sentences per item. Only shipped features; planned items say so.
# item.link: faq, cli, cbmpc, pricing (resolved in the include) or a full URL.
title: "kexify untuk developer"
intro: "Yang bisa Anda bangun dan uji dengan kexify hari ini. Sebagian besar alat ada di Mode Ahli: gratis, nonaktif secara default, di Pengaturan."
more: "Detail"

items:
  - icon: link
    title: "Hubungkan dApp lewat WalletConnect"
    body: "Pasangkan dApp dengan menempel URI WalletConnect atau memindai kode QR. Berjalan di jaringan EVM, Solana dan TRON, dan setiap permintaan membuka tinjauan yang mudah dibaca."
    link: faq
  - icon: beaker
    title: "Testnet"
    body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile, Bitcoin testnet dan lainnya. Aktifkan Mode Ahli, lalu jaringan uji, di Pengaturan."
    link: faq
  - icon: sliders
    title: "Alat Mode Ahli"
    body: "Atur nonce dan biaya sendiri, pilih UTXO, percepat dengan RBF, tanda tangani pesan mentah, dan tanda tangan saja dengan siaran terpisah. Anda juga bisa memakai RPC sendiri untuk jaringan mana pun."
    link: faq
  - icon: terminal
    title: "Pemulihan tanpa server, dan CLI"
    body: "Dengan file kunci Anda dan file kunci server, mode pemulihan menandatangani dan mengirim dari browser di setiap chain yang didukung, tanpa server kexify. CLI open source menampilkan alamat Anda, mengekspor kunci Anda (WIF untuk Bitcoin, Litecoin, dan Dogecoin) dan menjawab permintaan WalletConnect secara lokal."
    link: cli
  - icon: code
    title: "MPC open source (cb-mpc)"
    body: "Tanda tangan memakai ECDSA dan EdDSA 2 pihak dari Coinbase cb-mpc, lewat fork MIT kami. Aplikasi web dan CLI juga berlisensi MIT."
    link: cbmpc
  - icon: api
    title: "API Developer (segera hadir)"
    body: "Belum tersedia. Rencananya: API baca-saja gratis untuk dompet Anda sendiri. Di Premium: proposal API yang Anda setujui di iPhone, dan webhook. Penandatanganan otomatis menyusul nanti, untuk tim."
    link: pricing
    more: "Lihat paket"

