# 한국어 홈페이지 문구. 키는 en.yml과 같고, _includes/home.html이 표시합니다.
# 짧게 유지: 섹션마다 제목 하나, 문장 하나, 카드마다 한 줄. 값에는 인라인 HTML이 들어갈 수 있습니다.
# 모든 문구는 실제 웹 앱과 일치해야 하며, 아직 없는 기능은 "곧 출시"로 표시합니다.
hero:
  tagline: "안전망이 있는 암호화폐 지갑."
  sub: "시드 문구가 없습니다. 키는 내 기기와 kexify 서버에 나뉘어 있고, 서버는 공동 서명 전에 내가 정한 규칙을 확인합니다."
  stats: ["20개 이상 네트워크", "2-of-2 MPC", "시드 문구 0개"]
  cta_app: "웹 앱 열기"
  cta_dev: "개발자용"
  ios_note: "무료로 쓸 수 있습니다. iPhone 앱은 테스트 중이고, 웹 앱은 지금 바로 쓸 수 있습니다."
  move_title: "kexify가 kexify.co에서 kexify.app으로 옮겼습니다"
  move_body: '새 지갑은 <a href="https://my.kexify.app/" class="text-blue-400 hover:underline">my.kexify.app</a>에서 만듭니다. <a href="https://app.kexify.co/" class="text-blue-400 hover:underline">app.kexify.co</a>의 지갑은 그곳에서 계속 쓸 수 있지만 자동으로 옮길 수는 없습니다(패스키가 도메인에 묶여 있기 때문입니다). 새 지갑을 만들고 자금을 보내세요.'
  move_warning: "kexify는 이메일, 채팅, 고객 지원으로 키 파일이나 암호 문구를 절대 요구하지 않습니다."

safety:
  title: "기본부터 안전하게"
  intro: "규칙은 서버가 적용하기 때문에 노트북을 도난당하거나 나쁜 링크를 눌러도 건너뛸 수 없습니다."
  items:
    - icon: key
      title: "잃어버릴 시드 문구가 없습니다"
      body: "키 조각은 내 기기에 하나, 서버에 하나. 어느 쪽도 혼자서는 서명할 수 없습니다."
    - icon: limit
      title: "내가 정하는 일일 한도"
      body: "USD 한도를 넘는 전송은 차단되거나 1시간 또는 24시간 대기합니다."
    - icon: clock
      title: "규칙 변경은 24시간 대기"
      body: "더 엄격한 규칙은 바로 적용되고, 느슨한 규칙은 대기합니다. 한 번 클릭으로 동결할 수 있습니다."
    - icon: shield
      title: "무제한 승인 차단"
      body: "kexify는 무제한 토큰 승인에 공동 서명하지 않고, 한도를 정하게 합니다."
    - icon: eye
      title: "서명하는 내용이 보입니다"
      body: "쉬운 말로 된 내용 확인과, 알려진 사기 주소 대조."
    - icon: exit
      title: "언제든 떠날 수 있습니다"
      body: "두 키 파일이 있으면 서버 없이 브라우저나 CLI에서 서명할 수 있습니다."

how:
  title: "작동 방식"
  intro: "내 기기와 서버가 각각 키 조각을 하나씩 갖고 함께 서명하며, 전체 키는 존재하지 않습니다."
  steps:
    - title: "생성"
      body: "키 조각 두 개를 함께 만듭니다. 하나의 개인 키는 존재하지 않습니다."
    - title: "보관"
      body: "한 조각은 내 기기에, 한 조각은 서버에 둡니다. 둘 다 암호화됩니다."
    - title: "서명"
      body: "서버가 내 규칙을 확인한 뒤, 양쪽이 함께 서명합니다."
  browser: "내 기기"
  server: "서버"
  share_a: "키 조각 A"
  share_b: "키 조각 B"
  tip_a: "내 기기에서 암호화 (AES-GCM)"
  tip_b: "서버에서 암호화 (AES-256-GCM + HKDF)"
  channel: "오가는 것은 암호화된 메시지이며 키가 아닙니다"
  signature: "서명"

