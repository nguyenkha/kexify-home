# Texto de la página de inicio (es). Un archivo por idioma (mismas claves); _includes/home.html lo muestra.
# Breve: cada sección es un título, una frase y tarjetas de una línea.
# Los valores pueden llevar HTML en línea (enlaces, <code>). Toda afirmación debe ser cierta en la app web publicada;
# lo que aún no está construido se marca como "próximamente".
hero:
  tagline: "Una billetera cripto con red de seguridad."
  sub: "Sin frase semilla. Tu clave se divide entre tu dispositivo y el servidor de kexify, y el servidor comprueba tus reglas antes de cofirmar."
  stats: ["Más de 20 redes", "MPC 2-of-2", "0 frases semilla"]
  cta_app: "Abrir la app web"
  cta_dev: "Para desarrolladores"
  ios_note: "Uso gratuito. App para iPhone en pruebas; la app web funciona hoy."
  move_title: "kexify se ha mudado de kexify.co a kexify.app"
  move_body: 'Crea las billeteras nuevas en <a href="https://my.kexify.app/" class="text-blue-400 hover:underline">my.kexify.app</a>. Las billeteras de <a href="https://app.kexify.co/" class="text-blue-400 hover:underline">app.kexify.co</a> siguen funcionando allí, pero no se pueden mover de forma automática (las llaves de acceso están ligadas al dominio), así que crea una billetera nueva y envía tus fondos.'
  move_warning: "kexify nunca te pedirá tu archivo de clave ni tu frase de contraseña por correo, chat o soporte."

safety:
  title: "Seguro por defecto"
  intro: "El servidor aplica tus reglas, así que un portátil robado o un enlace malicioso no pueden saltárselas."
  items:
    - icon: key
      title: "Sin frase semilla que perder"
      body: "Un fragmento de clave en tu dispositivo y otro en el servidor; ninguno firma solo."
    - icon: limit
      title: "Un límite diario que controlas tú"
      body: "Por encima de tu límite en USD, el envío se bloquea o espera 1 o 24 horas."
    - icon: clock
      title: "Los cambios de reglas esperan 24 horas"
      body: "Las reglas más estrictas se aplican al instante; las más flexibles esperan, y puedes congelar con un clic."
    - icon: shield
      title: "Aprobaciones ilimitadas bloqueadas"
      body: "kexify no cofirma una aprobación ilimitada de tokens; tú fijas un tope."
    - icon: eye
      title: "Ves lo que firmas"
      body: "Revisión en lenguaje claro y comprobación contra direcciones de estafa conocidas."
    - icon: exit
      title: "Sal cuando quieras"
      body: "Con los dos archivos de clave puedes firmar en tu navegador o con la CLI, sin servidor."

how:
  title: "Cómo funciona"
  intro: "Tu dispositivo y el servidor guardan cada uno un fragmento de clave y firman juntos; la clave completa nunca existe."
  steps:
    - title: "Crear"
      body: "Se crean juntos dos fragmentos de clave. No existe una única clave privada."
    - title: "Guardar"
      body: "Un fragmento en tu dispositivo y otro en el servidor, ambos cifrados."
    - title: "Firmar"
      body: "El servidor comprueba tus reglas y luego ambos firman juntos."
  browser: "Tu dispositivo"
  server: "Servidor"
  share_a: "Fragmento de clave A"
  share_b: "Fragmento de clave B"
  tip_a: "Cifrado en tu dispositivo (AES-GCM)"
  tip_b: "Cifrado en el servidor (AES-256-GCM + HKDF)"
  channel: "mensajes cifrados, no claves"
  signature: "Firma"

dev:
  title: "Para desarrolladores"
  intro: "El modo experto es gratuito y viene desactivado; actívalo en Ajustes."
  more: "Leer la guía para desarrolladores"
  items:
    - title: "WalletConnect v2"
      body: "Conecta dApps en cadenas EVM, Solana y TRON."
    - title: "Redes de prueba"
      body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile y más."
    - title: "Modo experto"
      body: "Nonce y comisiones personalizados, selección de UTXO, tu propio RPC."
    - title: "Recuperación y CLI"
      body: "Reconstruye claves o firma en local con los dos archivos de clave."
    - title: "Código abierto"
      body: 'App web y CLI con licencia MIT, MPC de <a href="https://github.com/nguyenkha/cb-mpc" class="text-blue-400 hover:text-blue-300">cb-mpc</a>.'
    - title: "API para desarrolladores"
      body: "Próximamente: API de solo lectura, SDK de firma y webhooks."

chains:
  title: "Cadenas compatibles"
  evm_sub: "Ethereum, Base, Arbitrum, Polygon..."
  more: "Más"
  more_sub: "TRON, Algorand, Cardano, Stellar, LTC, BCH, DOGE"

plans:
  title: "Gratis y Premium"
  intro: "La seguridad básica es gratuita y nunca pasará a ser de pago."
  free_title: "Gratis"
  free_price: "$0, para siempre"
  free_items:
    - "Límite diario, direcciones de confianza y comprobaciones de seguridad"
    - "Kit de recuperación, modo de recuperación y CLI"
    - "WalletConnect, modo experto y redes de prueba"
    - "Sincronización cifrada de la libreta de direcciones"
  premium_title: "Premium"
  premium_price: "Próximamente"
  premium_items:
    - "iPhone como dispositivo de aprobación, firma por QR sin conexión"
    - "Alertas instantáneas y aumento automático de comisión"
    - "Direcciones de privacidad para Bitcoin, más subcuentas"
    - "SDK de firma y webhooks para desarrolladores"

cta:
  title: "Pruébalo primero con una cantidad pequeña"
  body: "kexify es un proyecto personal de un solo ingeniero, que se ofrece tal cual."
  app: "Abrir la app web"
  github: "Ver en GitHub"
