# 日本語のホームページ文言。キーは en.yml と同じ。_includes/home.html が表示します。
# 短く保つ：各セクションは見出し、1文、1行のカード。値にはインラインHTMLを含められます。
# すべての記述は実際のWebアプリと一致させ、未実装のものは「近日公開」と表記します。
hero:
  tagline: "セーフティネット付きの暗号資産ウォレット。"
  sub: "シードフレーズは不要です。鍵はあなたの端末とkexifyサーバーに分けて持たれ、サーバーは共同署名の前にあなた自身のルールを確認します。"
  stats: ["20以上のネットワーク", "2-of-2 MPC", "シードフレーズ0個"]
  cta_app: "Webアプリを開く"
  cta_dev: "開発者向け"
  ios_note: "無料で使えます。iPhoneアプリはテスト中です。Webアプリは今日から使えます。"
  move_title: "kexifyはkexify.coからkexify.appに移りました"
  move_body: '新しいウォレットは <a href="https://my.kexify.app/" class="text-blue-400 hover:underline">my.kexify.app</a> で作成します。<a href="https://app.kexify.co/" class="text-blue-400 hover:underline">app.kexify.co</a> のウォレットはそちらでそのまま使えますが、自動での移行はできません（パスキーはドメインに結び付いているためです）。新しいウォレットを作り、資金を送ってください。'
  move_warning: "kexifyが、メール、チャット、サポートで鍵ファイルやパスフレーズをお尋ねすることはありません。"

safety:
  title: "最初から安全"
  intro: "ルールはサーバーが適用するので、ノートPCが盗まれたり、怪しいリンクを開いたりしても、回避できません。"
  items:
    - icon: key
      title: "なくすシードフレーズがない"
      body: "キーシェアは端末に1つ、サーバーに1つ。どちらも単独では署名できません。"
    - icon: limit
      title: "自分で決める1日の上限"
      body: "USD上限を超える送金は、ブロックされるか、1時間または24時間待ちになります。"
    - icon: clock
      title: "ルール変更は24時間待ち"
      body: "厳しくする変更はすぐ反映、緩める変更は待機。ワンクリックで凍結できます。"
    - icon: shield
      title: "無制限の承認をブロック"
      body: "kexifyは無制限のトークン承認に共同署名せず、上限を設定してもらいます。"
    - icon: eye
      title: "署名する内容が見える"
      body: "わかりやすい言葉での確認と、既知の詐欺アドレスとの照合。"
    - icon: exit
      title: "いつでも離れられる"
      body: "2つの鍵ファイルがあれば、サーバーなしでブラウザやCLIで署名できます。"

how:
  title: "しくみ"
  intro: "端末とサーバーがそれぞれキーシェアを持ち、一緒に署名します。完全な鍵は存在しません。"
  steps:
    - title: "作成"
      body: "2つのキーシェアを一緒に作ります。単一の秘密鍵は存在しません。"
    - title: "保管"
      body: "1つは端末に、1つはサーバーに置きます。どちらも暗号化されています。"
    - title: "署名"
      body: "サーバーがルールを確認してから、両側が一緒に署名します。"
  browser: "あなたの端末"
  server: "サーバー"
  share_a: "キーシェアA"
  share_b: "キーシェアB"
  tip_a: "端末上で暗号化（AES-GCM）"
  tip_b: "サーバー上で暗号化（AES-256-GCM + HKDF）"
  channel: "やり取りするのは暗号化されたメッセージで、鍵ではありません"
  signature: "署名"

