safety:
  title: "ปลอดภัยตั้งแต่เริ่มต้น"
  intro: "เซิร์ฟเวอร์เป็นผู้บังคับใช้กฎของคุณ แล็ปท็อปที่ถูกขโมยหรือลิงก์อันตรายจึงข้ามกฎเหล่านี้ไม่ได้"
  items:
    - icon: key
      title: "ไม่มีซีดเฟรสให้ทำหาย"
      body: "ส่วนคีย์หนึ่งส่วนบนอุปกรณ์ของคุณ อีกส่วนบนเซิร์ฟเวอร์ ไม่มีส่วนใดลงนามได้ลำพัง"
    - icon: limit
      title: "วงเงินรายวันที่คุณควบคุมเอง"
      body: "เมื่อเกินวงเงิน USD ของคุณ การส่งจะถูกบล็อก หรือต้องรอ 1 หรือ 24 ชั่วโมง"
    - icon: clock
      title: "เปลี่ยนกฎต้องรอ 24 ชั่วโมง"
      body: "กฎที่เข้มขึ้นมีผลทันที กฎที่หลวมลงต้องรอ และคุณระงับกระเป๋าได้ในคลิกเดียว"
    - icon: shield
      title: "บล็อกการอนุมัติแบบไม่จำกัด"
      body: "kexify จะไม่ร่วมลงนามการอนุมัติโทเคนแบบไม่จำกัด คุณตั้งเพดานเอง"
    - icon: eye
      title: "เห็นสิ่งที่คุณลงนาม"
      body: "สรุปเป็นภาษาที่เข้าใจง่าย พร้อมตรวจกับที่อยู่หลอกลวงที่รู้จัก"
    - icon: exit
      title: "ออกได้ทุกเมื่อ"
      body: "เมื่อมีไฟล์คีย์ทั้งสอง คุณลงนามในเบราว์เซอร์หรือ CLI ได้ โดยไม่ต้องใช้เซิร์ฟเวอร์"

how:
  title: "ทำงานอย่างไร"
  intro: "อุปกรณ์ของคุณและเซิร์ฟเวอร์ต่างถือส่วนคีย์คนละส่วนและลงนามร่วมกัน คีย์ฉบับเต็มไม่เคยเกิดขึ้น"
  steps:
    - title: "สร้าง"
      body: "ส่วนคีย์สองส่วนถูกสร้างพร้อมกัน ไม่มีไพรเวทคีย์ฉบับเดียว"
    - title: "เก็บ"
      body: "ส่วนหนึ่งอยู่บนอุปกรณ์ของคุณ อีกส่วนอยู่บนเซิร์ฟเวอร์ เข้ารหัสทั้งคู่"
    - title: "ลงนาม"
      body: "เซิร์ฟเวอร์ตรวจกฎของคุณ แล้วทั้งสองฝ่ายลงนามร่วมกัน"
  browser: "อุปกรณ์ของคุณ"
  server: "เซิร์ฟเวอร์"
  share_a: "ส่วนคีย์ A"
  share_b: "ส่วนคีย์ B"
  tip_a: "เข้ารหัสบนอุปกรณ์ของคุณ (AES-GCM)"
  tip_b: "เข้ารหัสบนเซิร์ฟเวอร์ (AES-256-GCM + HKDF)"
  channel: "ส่งข้อความที่เข้ารหัส ไม่ส่งคีย์"
  signature: "ลายเซ็น"

