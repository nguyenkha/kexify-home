  title: "ฟรีและพรีเมียม"
  free_title: "ฟรี"
  free_price: "$0 ตลอดไป"
  free_items:
    - "กระเป๋าพร้อมนโยบายแบบง่าย: วงเงินรายวัน ที่อยู่ที่ไว้ใจ การรอเมื่อเกินวงเงิน"
    - "การตรวจความปลอดภัย: บล็อกการอนุมัติแบบไม่จำกัด และตรวจที่อยู่เสี่ยง"
    - "เร่งธุรกรรมด้วยตนเองในเครือข่ายที่รองรับ (Bitcoin, Litecoin)"
    - "ชุดกู้คืน โหมดกู้คืน และ CLI"
