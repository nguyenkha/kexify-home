# Home page copy (Thai). Same keys as en.yml.
hero:
  tagline: "กระเป๋าคริปโตที่มีตาข่ายนิรภัย"
  sub: "ไม่มีซีดเฟรส คีย์ของคุณถูกแบ่งระหว่างอุปกรณ์ของคุณกับเซิร์ฟเวอร์ kexify และเซิร์ฟเวอร์จะตรวจกฎที่คุณตั้งเองก่อนร่วมลงนาม"
  stats: ["20+ เครือข่าย", "2-of-2 MPC", "ซีดเฟรส 0 ชุด"]
  cta_app: "เปิดเว็บแอป"
  cta_dev: "สำหรับนักพัฒนา"
  ios_note: "ใช้ฟรี แอป iPhone อยู่ในช่วงทดสอบ ส่วนเว็บแอปใช้งานได้แล้ววันนี้"
  move_title: "kexify ย้ายจาก kexify.co ไปที่ kexify.app แล้ว"
  move_body: 'กระเป๋าใหม่สร้างได้ที่ <a href="https://my.kexify.app/" class="text-blue-400 hover:underline">my.kexify.app</a> หากคุณมีกระเป๋าที่ <a href="https://app.kexify.co/" class="text-blue-400 hover:underline">app.kexify.co</a> อยู่แล้ว ก็ยังใช้งานที่นั่นได้ต่อไป แต่ย้ายมาอัตโนมัติไม่ได้ เพราะพาสคีย์ผูกกับโดเมนที่สร้างไว้ หากต้องการย้าย ให้สร้างกระเป๋าใหม่ที่ my.kexify.app แล้วโอนเงินของคุณมา เข้าสู่ระบบที่ app.kexify.co เพื่อดูรายละเอียด'
  move_warning: "kexify จะไม่มีวันขอไฟล์คีย์หรือวลีรหัสผ่านของคุณทางอีเมล แชต หรือฝ่ายซัพพอร์ต"

safety:
  title: "ปลอดภัยตั้งแต่เริ่มต้น"
  intro: "สร้างมาเพื่อคนที่เพิ่งเริ่มใช้คริปโต ความผิดพลาดที่มือใหม่มักเจอจะถูกบล็อกหรือถูกชะลอ และเซิร์ฟเวอร์เป็นผู้บังคับใช้กฎของคุณ ดังนั้นแล็ปท็อปที่ถูกขโมยหรือลิงก์อันตรายจะข้ามกฎเหล่านี้ไม่ได้"
  items:
    - icon: key
      title: "ไม่มีซีดเฟรสให้ทำหาย"
      body: "ส่วนคีย์สองส่วน ส่วนหนึ่งอยู่บนอุปกรณ์ของคุณ อีกส่วนอยู่บนเซิร์ฟเวอร์ ไม่มีส่วนใดลงนามได้ลำพัง ชุดสำรองที่มีการตรวจวลีรหัสผ่านช่วยให้ส่วนคีย์ของคุณปลอดภัย"
    - icon: limit
      title: "วงเงินรายวันที่คุณควบคุมเอง"
      body: "ตั้งวงเงินรายวันเป็น USD และอนุญาตให้ส่งเฉพาะที่อยู่ที่ไว้ใจ เมื่อเกินวงเงิน การส่งจะถูกบล็อก หรือต้องรอ 1 หรือ 24 ชั่วโมง"
    - icon: clock
      title: "เปลี่ยนกฎต้องรอ 24 ชั่วโมง"
      body: "กฎที่เข้มขึ้นมีผลทันที กฎที่หลวมลงต้องรอ 24 ชั่วโมง คนที่เข้ามาได้จึงปิดกฎเหล่านี้ทันทีไม่ได้ ระงับกระเป๋าของคุณได้ในคลิกเดียว"
    - icon: shield
      title: "บล็อกการอนุมัติแบบไม่จำกัด"
      body: "dApp มักขอสิทธิ์ใช้โทเคนทั้งหมดตลอดไป kexify ปฏิเสธที่จะร่วมลงนามในเรื่องนี้ คุณตั้งเพดานแทนได้"
    - icon: alert
      title: "ตรวจที่อยู่เสี่ยง"
      body: "ก่อนลงนาม ผู้รับจะถูกตรวจกับรายชื่อที่อยู่หลอกลวงและฟิชชิงของ GoPlus Security และผู้รับรายใหม่จะมีคำเตือนด้วย"
    - icon: eye
      title: "เห็นสิ่งที่คุณลงนาม"
      body: "การโอน การอนุมัติโทเคน permit และข้อมูลแบบ typed data จะแสดงเป็นภาษาที่เข้าใจง่าย พร้อมที่อยู่เต็มและจำนวนเงิน ก่อนที่คุณจะยืนยัน"

how:
  title: "ทำงานอย่างไร"
  steps:
    - title: "สร้าง"
      body: "ส่วนคีย์อิสระสองส่วนถูกสร้างพร้อมกัน ไม่มีไพรเวทคีย์ฉบับเดียวเกิดขึ้นเลย"
    - title: "เก็บ"
      body: "ส่วนหนึ่งอยู่บนอุปกรณ์ของคุณ อีกส่วนอยู่บนเซิร์ฟเวอร์ ทั้งสองส่วนเข้ารหัสไว้"
    - title: "ลงนาม"
      body: "อุปกรณ์ของคุณและเซิร์ฟเวอร์ลงนามร่วมกัน เซิร์ฟเวอร์ตรวจกฎของคุณก่อน และลงนามเองลำพังไม่ได้"
  mpc_title: "การลงนามด้วย MPC"
  browser: "อุปกรณ์ของคุณ"
  server: "เซิร์ฟเวอร์"
  share_a: "ส่วนคีย์ A"
  share_b: "ส่วนคีย์ B"
  tip_a: "เข้ารหัสบนอุปกรณ์ของคุณ (AES-GCM)"
  tip_b: "เข้ารหัสบนเซิร์ฟเวอร์ (AES-256-GCM + HKDF)"
  channel: "ส่งข้อความที่เข้ารหัส ไม่ส่งคีย์"
  signature: "ลายเซ็น"
  never: 'คีย์ฉบับเต็ม<span class="text-blue-400">ไม่เคยเกิดขึ้น</span> ทั้งบนอุปกรณ์ของคุณ บนเซิร์ฟเวอร์ และระหว่างส่งข้อมูล'

exit:
  title: "ออกได้ทุกเมื่อ ไม่ต้องพึ่งเซิร์ฟเวอร์"
  body: "เก็บไฟล์คีย์ของคุณไว้เอง และในโหมดผู้เชี่ยวชาญ ขอไฟล์คีย์ของเซิร์ฟเวอร์ได้ด้วย (จะปลดล็อกหลังช่วงรอเพื่อความปลอดภัย) เมื่อมีทั้งสองไฟล์ โหมดกู้คืนจะลงนามในเบราว์เซอร์ของคุณโดยไม่ต้องใช้เซิร์ฟเวอร์ kexify เลย CLI แบบโอเพนซอร์สทำแบบเดียวกันได้ หรือแปลงสองไฟล์กลับเป็นไพรเวทคีย์ปกติ"

dev:
  title: "สำหรับนักพัฒนา"
  intro: "โหมดผู้เชี่ยวชาญใช้ฟรีและปิดไว้เป็นค่าเริ่มต้น เปิดได้ในการตั้งค่าเมื่อต้องการตัวควบคุมเพิ่ม"
  more: "อ่านคู่มือสำหรับนักพัฒนา"
  items:
    - title: "WalletConnect v2"
      body: "Ethereum และ EVM L2 (<code>eth_sendTransaction</code>, <code>personal_sign</code>, <code>eth_signTypedData_v4</code>), Solana และ TRON"
    - title: "เทสต์เน็ต"
      body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile และ Shasta, Bitcoin testnet, Cardano PreProd และอื่น ๆ เปิดได้ด้วยสวิตช์เดียวในโหมดผู้เชี่ยวชาญ"
    - title: "โหมดผู้เชี่ยวชาญ"
      body: "กำหนด nonce และค่าธรรมเนียมเอง เลือก UTXO เร่งธุรกรรมด้วย RBF สำหรับ BTC และ LTC ลงนามข้อความดิบ ลงนามอย่างเดียวแล้วบรอดแคสต์แยกต่างหาก"
    - title: "RPC ของคุณเอง"
      body: "เปลี่ยน RPC และ explorer ของเชนใดก็ได้เป็นปลายทาง Alchemy, Infura หรือ QuickNode ของคุณ พร้อมการตรวจสถานะแบบสด และแก้ไขคอนฟิกทั้งหมดเป็น JSON ได้"
    - title: "CLI และการกู้คืน"
      body: "Bun CLI สร้างคีย์ขึ้นใหม่จากไฟล์คีย์สองไฟล์ (<code>recover</code>) หรือลงนามคำขอ WalletConnect ในเครื่อง (<code>connect</code>)"
    - title: "โอเพนซอร์ส"
      body: 'เว็บแอปใช้สัญญาอนุญาต MIT บน <a href="https://github.com/nguyenkha/kexify-web" class="text-blue-400 hover:text-blue-300">GitHub</a> ส่วน MPC ทำงานบน <a href="https://github.com/coinbase/cb-mpc" class="text-blue-400 hover:text-blue-300">Coinbase cb-mpc</a> ผ่าน<a href="https://github.com/nguyenkha/cb-mpc" class="text-blue-400 hover:text-blue-300">ฟอร์กของเรา</a>'

chains:
  title: "เชนที่รองรับ"
  evm_sub: "Ethereum, Base, Arbitrum, Polygon..."
  more: "เพิ่มเติม"
  more_sub: "TRON, Algorand, Cardano, Stellar, LTC, BCH, DOGE"

