why:
  title: "ทำไมต้อง kexify"
  items:
    - title: "เทียบกับกระเป๋าแบบซีดแฟรส"
      body: "ความลับเดียวบนอุปกรณ์เดียว ถ้ารั่ว ทุกอย่างหมด กับ kexify ส่วนคีย์บนอุปกรณ์ที่รั่วเพียงส่วนเดียวย้ายเงินไม่ได้"
    - title: "เทียบกับแอปแบบ custodial"
      body: "ไม่ใช่คีย์ของคุณ ก็ไม่ใช่คริปโตของคุณ กับ kexify คุณเอาไฟล์คีย์ได้ทั้งสองไฟล์และลงนามได้โดยไม่ต้องพึ่งเรา"
    - title: "เทียบกับกระเป๋า MPC อื่น"
      body: "กฎของคุณถูกบังคับใช้โดยผู้ร่วมลงนาม และทางออกของคุณไม่ขึ้นกับเซิร์ฟเวอร์ของเรา"

cta:
  title: "ลองด้วยจำนวนเล็กน้อยก่อน"
  body: "kexify เป็นโปรเจกต์ส่วนตัวของวิศวกรคนเดียว ให้ใช้ตามสภาพ เริ่มจากจำนวนน้อย อ่านคำถามที่พบบ่อย แล้วค่อยเพิ่มทีละน้อย"
  app: "เปิดเว็บแอป"
  github: "ดูบน GitHub"
