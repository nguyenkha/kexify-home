# Home page copy. One file per language (same keys); _includes/home.html renders it.
# Values may hold inline HTML (links, <code>). Every claim must be true in the shipped web app;
# anything not built is labelled "planned".
hero:
  tagline: "A crypto wallet with a safety net."
  sub: "No seed phrase. Your key is split between your device and the kexify server, and the server checks your own rules before it co-signs."
  stats: ["20+ networks", "2-of-2 MPC", "0 seed phrases"]
  cta_app: "Open the web app"
  cta_dev: "For developers"
  ios_note: "Free to use. iPhone app in testing; the web app works today."
  move_title: "kexify has moved from kexify.co to kexify.app"
  move_body: 'New wallets are created at <a href="https://my.kexify.app/" class="text-blue-400 hover:underline">my.kexify.app</a>. Already have a wallet at <a href="https://app.kexify.co/" class="text-blue-400 hover:underline">app.kexify.co</a>? It keeps working there, but it cannot be moved over automatically: passkeys are tied to the domain they were created on. To move, create a new wallet at my.kexify.app and send your funds across. Sign in at app.kexify.co for the details.'
  move_warning: "kexify will never ask for your key file or passphrase by email, chat or support."

safety:
  title: "Safe by default"
  intro: "Built for people who are new to crypto. The usual beginner mistakes are blocked or slowed down, and the server enforces your rules, so a stolen laptop or a bad link cannot skip them."
  items:
    - icon: key
      title: "No seed phrase to lose"
      body: "Two key shares, one on your device and one on the server. Neither can sign alone. A backup kit with a passphrase check keeps your share safe."
    - icon: limit
      title: "A daily limit you control"
      body: "Set a daily USD limit and allow sends to trusted addresses only. Above the limit, the send is blocked or waits 1 or 24 hours."
    - icon: clock
      title: "Rule changes wait 24 hours"
      body: "Tighter rules apply at once. Looser rules wait 24 hours, so someone who gets in cannot just turn them off. Freeze your wallet in one click."
    - icon: shield
      title: "Unlimited approvals blocked"
      body: "dApps often ask to spend all of a token forever. kexify refuses to co-sign that; you set a cap instead."
    - icon: alert
      title: "Risky address check"
      body: "Before signing, the recipient is checked against GoPlus Security's list of scam and phishing addresses. A new recipient gets a warning too."
    - icon: eye
      title: "See what you sign"
      body: "Transfers, token approvals, permits and typed data are shown in plain words, with the full address and the amount, before you confirm."

how:
  title: "How it works"
  steps:
    - title: "Create"
      body: "Two independent key shares are created together. No single private key ever exists."
    - title: "Store"
      body: "One share stays on your device, one on the server. Both are encrypted."
    - title: "Sign"
      body: "Your device and the server sign together. The server checks your rules first and cannot sign alone."
  mpc_title: "MPC signing"
  browser: "Your device"
  server: "Server"
  share_a: "Key share A"
  share_b: "Key share B"
  tip_a: "Encrypted on your device (AES-GCM)"
  tip_b: "Encrypted on the server (AES-256-GCM + HKDF)"
  channel: "encrypted messages, not keys"
  signature: "Signature"
  never: 'The full key <span class="text-blue-400">never exists</span>: not on your device, not on the server, not in transit.'

exit:
  title: "Leave anytime, no server needed"
  body: "Keep your own key file, and in Expert mode request the server's key file too (it unlocks after a safety wait). With both files, recovery mode signs in your browser with no kexify server at all. The open-source CLI can do the same, or turn the two files back into a normal private key."

dev:
  title: "For developers"
  intro: "Expert mode is free and off by default. Turn it on in Settings when you want the knobs."
  more: "Read the developer guide"
  items:
    - title: "WalletConnect v2"
      body: "Ethereum and EVM L2s (<code>eth_sendTransaction</code>, <code>personal_sign</code>, <code>eth_signTypedData_v4</code>), Solana and TRON."
    - title: "Testnets"
      body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile and Shasta, Bitcoin testnet, Cardano PreProd and more, one toggle in Expert mode."
    - title: "Expert mode"
      body: "Nonce and fee overrides, UTXO selection, RBF speed-up for BTC and LTC, raw message signing, sign-only with separate broadcast."
    - title: "Your own RPC"
      body: "Swap the RPC and explorer of any chain for your Alchemy, Infura or QuickNode endpoint, with a live health check. Edit the whole config as JSON."
    - title: "CLI and recovery"
      body: "A Bun CLI rebuilds keys from the two key files (<code>recover</code>) or signs WalletConnect requests locally (<code>connect</code>)."
    - title: "Open source"
      body: 'The web app is MIT on <a href="https://github.com/nguyenkha/kexify-web" class="text-blue-400 hover:text-blue-300">GitHub</a>. MPC runs on <a href="https://github.com/coinbase/cb-mpc" class="text-blue-400 hover:text-blue-300">Coinbase cb-mpc</a> through <a href="https://github.com/nguyenkha/cb-mpc" class="text-blue-400 hover:text-blue-300">our fork</a>.'

chains:
  title: "Supported chains"
  evm_sub: "Ethereum, Base, Arbitrum, Polygon..."
  more: "More"
  more_sub: "TRON, Algorand, Cardano, Stellar, LTC, BCH"

plans:
  title: "Free and Premium"
  free_title: "Free"
  free_price: "$0, forever"
  free_items:
    - "Everything above"
    - "Daily limit, trusted addresses, wait above the limit"
    - "Unlimited-approval block and risky address check"
    - "Freeze, backup kit, recovery mode, CLI"
    - "WalletConnect and Expert mode"
    - "iPhone app (coming soon)"
    - "Balance-change preview before you sign (coming soon)"
  premium_title: "Premium"
  premium_price: "Price coming soon"
  premium_note: "Planned, not built yet. Basic safety will never move behind a paywall."
  premium_items:
    - "iPhone as an approval device"
    - "Offline QR signing"
    - "Custom rules and a wait for large amounts"
    - "Deeper simulation with a risk scan"
    - "Instant alerts and automatic fee bump"
    - "More separate wallets"
  planned: "planned"

why:
  title: "Why kexify"
  items:
    - title: "vs. seed-phrase wallets"
      body: "One secret on one device. If it leaks, everything is gone. With kexify, a leaked device share alone cannot move funds."
    - title: "vs. custodial apps"
      body: "Not your keys, not your crypto. With kexify you can take both key files and sign without us."
    - title: "vs. other MPC wallets"
      body: "Your rules are enforced by the co-signer, and your exit does not depend on our server."

cta:
  title: "Try it with a small amount first"
  body: "kexify is a personal project by one engineer, provided as is. Start small, read the FAQ, and grow from there."
  app: "Open the web app"
  github: "View on GitHub"
