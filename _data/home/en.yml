# Home page copy. One file per language (same keys); _includes/home.html renders it.
# Keep it short: each section is a headline, one sentence, then cards with one line each.
# Values may hold inline HTML (links, <code>). Every claim must be true in the shipped web app;
# anything not built is labelled "coming soon".
hero:
  tagline: "A crypto wallet with a safety net."
  sub: "No seed phrase. Your key is split between your device and the kexify server, which checks your rules before it co-signs."
  stats: ["20+ networks", "2-of-2 MPC", "0 seed phrases"]
  cta_app: "Open the web app"
  cta_dev: "For developers"
  ios_note: "Free to use. iPhone app in testing; the web app works today."
  move_title: "kexify has moved from kexify.co to kexify.app"
  move_body: 'Create new wallets at <a href="https://my.kexify.app/" class="text-blue-400 hover:underline">my.kexify.app</a>. Wallets at <a href="https://app.kexify.co/" class="text-blue-400 hover:underline">app.kexify.co</a> keep working there but cannot move over automatically (passkeys are tied to the domain), so create a new wallet and send your funds across.'
  move_warning: "kexify will never ask for your key file or passphrase by email, chat or support."

safety:
  title: "Safe by default"
  intro: "The server enforces your rules, so a stolen laptop or a bad link cannot skip them."
  items:
    - icon: key
      title: "No seed phrase to lose"
      body: "One key share on your device, one on the server; neither signs alone."
    - icon: limit
      title: "A daily limit you control"
      body: "Above your USD limit, a send is blocked or waits 1 or 24 hours."
    - icon: clock
      title: "Rule changes wait 24 hours"
      body: "Tighter rules apply at once; looser ones wait, and you can freeze in one click."
    - icon: shield
      title: "Unlimited approvals blocked"
      body: "kexify will not co-sign an unlimited token approval; you set a cap."
    - icon: eye
      title: "See what you sign"
      body: "Plain-language review, plus a check against known scam addresses."
    - icon: exit
      title: "Leave anytime"
      body: "With both key files you can sign in your browser or the CLI, no server needed."

how:
  title: "How it works"
  intro: "Your device and the server each hold a key share and sign together; the full key never exists."
  steps:
    - title: "Create"
      body: "Two key shares are made together. No single private key exists."
    - title: "Store"
      body: "One share on your device, one on the server, both encrypted."
    - title: "Sign"
      body: "The server checks your rules, then both sides sign together."
  browser: "Your device"
  server: "Server"
  share_a: "Key share A"
  share_b: "Key share B"
  tip_a: "Encrypted on your device (AES-GCM)"
  tip_b: "Encrypted on the server (AES-256-GCM + HKDF)"
  channel: "encrypted messages, not keys"
  signature: "Signature"

dev:
  title: "For developers"
  intro: "Expert mode is free and off by default; turn it on in Settings."
  more: "Read the developer guide"
  items:
    - title: "WalletConnect v2"
      body: "Connect dApps on EVM chains, Solana and TRON."
    - title: "Testnets"
      body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile and more."
    - title: "Expert mode"
      body: "Nonce and fee overrides, UTXO selection, your own RPC."
    - title: "Recovery and CLI"
      body: "Rebuild keys or sign locally from the two key files."
    - title: "Open source"
      body: 'MIT web app and CLI, MPC from <a href="https://github.com/nguyenkha/cb-mpc" class="text-blue-400 hover:text-blue-300">cb-mpc</a>.'
    - title: "Developer API"
      body: "Coming soon: read-only API, signing SDK and webhooks."

chains:
  title: "Supported chains"
  evm_sub: "Ethereum, Base, Arbitrum, Polygon..."
  more: "More"
  more_sub: "TRON, Algorand, Cardano, Stellar, LTC, BCH, DOGE"

plans:
  title: "Free and Premium"
  intro: "Basic safety is free and will never move behind a paywall."
  free_title: "Free"
  free_price: "$0, forever"
  free_items:
    - "Daily limit, trusted addresses and safety checks"
    - "Recovery kit, recovery mode and the CLI"
    - "WalletConnect, Expert mode and testnets"
    - "Encrypted address book sync"
  premium_title: "Premium"
  premium_price: "Coming soon"
  premium_items:
    - "iPhone as an approval device, air-gapped signing"
    - "Instant alerts and automatic fee bump"
    - "Bitcoin privacy addresses, more sub-accounts"
    - "Signing SDK and webhooks for developers"

cta:
  title: "Try it with a small amount first"
  body: "kexify is a personal project by one engineer, provided as is."
  app: "Open the web app"
  github: "View on GitHub"
