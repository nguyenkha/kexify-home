# Trang chủ tiếng Việt. Cùng khoá với en.yml; _includes/home.html hiển thị.
# Giữ ngắn gọn: mỗi mục có tiêu đề, một câu, rồi các thẻ một dòng.
# Giá trị có thể chứa HTML nội tuyến (link, <code>). Mọi điều nêu ra phải đúng với ứng dụng web đã phát hành;
# thứ chưa làm xong được ghi "sắp ra mắt".
hero:
  tagline: "Ví tiền mã hoá có lưới an toàn."
  sub: "Không có seed phrase. Khoá của bạn được chia giữa thiết bị và máy chủ kexify, và máy chủ kiểm tra quy tắc của bạn trước khi đồng ký."
  stats: ["20+ mạng", "2-of-2 MPC", "0 seed phrase"]
  cta_app: "Mở ứng dụng web"
  cta_dev: "Dành cho nhà phát triển"
  ios_note: "Dùng miễn phí. Ứng dụng iPhone đang thử nghiệm; ứng dụng web dùng được ngay hôm nay."
  move_title: "kexify đã chuyển từ kexify.co sang kexify.app"
  move_body: 'Hãy tạo ví mới tại <a href="https://my.kexify.app/" class="text-blue-400 hover:underline">my.kexify.app</a>. Ví tại <a href="https://app.kexify.co/" class="text-blue-400 hover:underline">app.kexify.co</a> vẫn hoạt động ở đó nhưng không thể chuyển sang tự động (passkey gắn với tên miền), nên hãy tạo ví mới rồi gửi tiền sang.'
  move_warning: "kexify sẽ không bao giờ hỏi file khoá hay passphrase của bạn qua email, chat hay hỗ trợ."

safety:
  title: "An toàn ngay từ đầu"
  intro: "Máy chủ thực thi quy tắc của bạn, nên laptop bị đánh cắp hay một đường link xấu cũng không thể bỏ qua chúng."
  items:
    - icon: key
      title: "Không lo mất seed phrase"
      body: "Một phần khoá trên thiết bị, một phần trên máy chủ; không bên nào ký được một mình."
    - icon: limit
      title: "Giới hạn hằng ngày do bạn đặt"
      body: "Vượt giới hạn USD của bạn, giao dịch bị chặn hoặc phải chờ 1 hoặc 24 giờ."
    - icon: clock
      title: "Đổi quy tắc phải chờ 24 giờ"
      body: "Quy tắc chặt hơn có hiệu lực ngay; lỏng hơn phải chờ, và bạn có thể đóng băng chỉ với một cú nhấp."
    - icon: shield
      title: "Chặn quyền chi tiêu không giới hạn"
      body: "kexify không đồng ký phê duyệt token không giới hạn; bạn đặt một mức tối đa."
    - icon: eye
      title: "Thấy rõ mình đang ký gì"
      body: "Giao dịch được hiển thị bằng lời dễ hiểu, kèm kiểm tra với địa chỉ lừa đảo đã biết."
    - icon: exit
      title: "Rời đi bất cứ lúc nào"
      body: "Có đủ hai file khoá, bạn có thể ký trong trình duyệt hoặc bằng CLI, không cần máy chủ."

how:
  title: "Cách hoạt động"
  intro: "Thiết bị của bạn và máy chủ mỗi bên giữ một phần khoá và cùng ký; khoá đầy đủ không bao giờ tồn tại."
  steps:
    - title: "Tạo"
      body: "Hai phần khoá được tạo cùng lúc. Không tồn tại một khoá riêng đơn lẻ."
    - title: "Lưu"
      body: "Một phần trên thiết bị, một phần trên máy chủ, cả hai đều được mã hoá."
    - title: "Ký"
      body: "Máy chủ kiểm tra quy tắc của bạn, rồi hai bên cùng ký."
  browser: "Thiết bị của bạn"
  server: "Máy chủ"
  share_a: "Phần khoá A"
  share_b: "Phần khoá B"
  tip_a: "Mã hoá trên thiết bị của bạn (AES-GCM)"
  tip_b: "Mã hoá trên máy chủ (AES-256-GCM + HKDF)"
  channel: "tin nhắn mã hoá, không phải khoá"
  signature: "Chữ ký"

dev:
  title: "Dành cho nhà phát triển"
  intro: "Expert mode miễn phí và tắt mặc định; bật trong Cài đặt."
  more: "Đọc hướng dẫn cho nhà phát triển"
  items:
    - title: "WalletConnect v2"
      body: "Kết nối dApp trên các chain EVM, Solana và TRON."
    - title: "Testnet"
      body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile và nhiều mạng khác."
    - title: "Expert mode"
      body: "Ghi đè nonce và phí, chọn UTXO, RPC riêng của bạn."
    - title: "Khôi phục và CLI"
      body: "Dựng lại khoá hoặc ký ngay trên máy từ hai file khoá."
    - title: "Mã nguồn mở"
      body: 'Ứng dụng web và CLI dùng giấy phép MIT, MPC từ <a href="https://github.com/nguyenkha/cb-mpc" class="text-blue-400 hover:text-blue-300">cb-mpc</a>.'
    - title: "API cho nhà phát triển"
      body: "Sắp ra mắt: API chỉ đọc, đề xuất qua API mà bạn phê duyệt trên iPhone và webhook."

chains:
