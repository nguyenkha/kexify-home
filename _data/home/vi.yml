  premium_title: "Premium"
  premium_price: "Sắp ra mắt"
  premium_note: "Chưa xây dựng. Các tính năng an toàn cơ bản sẽ luôn miễn phí, không bao giờ chuyển sang gói trả phí."
  premium_items:
