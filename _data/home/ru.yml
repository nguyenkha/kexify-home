# Home page copy (ru). Same keys as en.yml; _includes/home.html renders it.
hero:
  tagline: "Криптокошелёк со страховкой."
  sub: "Без seed-фразы. Ваш ключ разделён между вашим устройством и сервером kexify, а сервер проверяет ваши собственные правила, прежде чем подписать вместе с вами."
  stats: ["Более 20 сетей", "MPC 2-of-2", "0 seed-фраз"]
  cta_app: "Открыть веб-приложение"
  cta_dev: "Для разработчиков"
  ios_note: "Пользоваться бесплатно. Приложение для iPhone в тестировании; веб-приложение работает уже сейчас."
  move_title: "kexify переехал с kexify.co на kexify.app"
  move_body: 'Новые кошельки создаются на <a href="https://my.kexify.app/" class="text-blue-400 hover:underline">my.kexify.app</a>. Уже есть кошелёк на <a href="https://app.kexify.co/" class="text-blue-400 hover:underline">app.kexify.co</a>? Он продолжает работать там, но автоматически перенести его нельзя: passkey привязаны к домену, на котором были созданы. Чтобы перейти, создайте новый кошелёк на my.kexify.app и переведите туда средства. Подробности есть после входа на app.kexify.co.'
  move_warning: "kexify никогда не попросит ваш файл ключа или парольную фразу по почте, в чате или через поддержку."

safety:
  title: "Безопасно по умолчанию"
  intro: "Сделан для тех, кто только знакомится с криптой. Типичные ошибки новичков блокируются или замедляются, а сервер следит за вашими правилами, так что украденный ноутбук или плохая ссылка их не обойдут."
  items:
    - icon: key
      title: "Нет seed-фразы, которую можно потерять"
      body: "Две части ключа: одна на вашем устройстве, другая на сервере. По отдельности они не могут подписать. Набор для резервной копии с проверкой парольной фразы защищает вашу часть."
    - icon: limit
      title: "Дневной лимит под вашим контролем"
      body: "Задайте дневной лимит в долларах США и разрешите отправку только на доверенные адреса. Сверх лимита отправка блокируется или ждёт 1 или 24 часа."
    - icon: clock
      title: "Изменения правил ждут 24 часа"
      body: "Более строгие правила действуют сразу. Более мягкие ждут 24 часа, поэтому тот, кто получил доступ, не сможет просто их отключить. Заморозьте кошелёк одним нажатием."
    - icon: shield
      title: "Безлимитные разрешения заблокированы"
      body: "dApp часто просят право тратить весь токен без срока. kexify отказывается подписывать такое; вместо этого вы задаёте потолок."
    - icon: alert
      title: "Проверка рискованных адресов"
      body: "Перед подписью получатель сверяется со списком мошеннических и фишинговых адресов GoPlus Security. Новый получатель тоже вызывает предупреждение."
    - icon: eye
      title: "Видно, что вы подписываете"
      body: "Переводы, разрешения на токены, permit и типизированные данные показываются простыми словами, с полным адресом и суммой, до вашего подтверждения."

how:
  title: "Как это работает"
  steps:
    - title: "Создание"
      body: "Две независимые части ключа создаются вместе. Единого приватного ключа не существует."
    - title: "Хранение"
      body: "Одна часть остаётся на вашем устройстве, другая на сервере. Обе зашифрованы."
    - title: "Подпись"
      body: "Ваше устройство и сервер подписывают вместе. Сервер сначала проверяет ваши правила и не может подписать в одиночку."
  mpc_title: "Подпись MPC"
  browser: "Ваше устройство"
  server: "Сервер"
  share_a: "Часть ключа A"
  share_b: "Часть ключа B"
  tip_a: "Зашифрована на вашем устройстве (AES-GCM)"
  tip_b: "Зашифрована на сервере (AES-256-GCM + HKDF)"
  channel: "зашифрованные сообщения, а не ключи"
  signature: "Подпись"
  never: 'Полный ключ <span class="text-blue-400">никогда не существует</span>: ни на вашем устройстве, ни на сервере, ни при передаче.'

exit:
  title: "Уйти можно в любой момент, сервер не нужен"
  body: "Храните свой файл ключа, а в режиме эксперта запросите и файл ключа сервера (он открывается после защитной задержки). С обоими файлами режим восстановления подписывает в вашем браузере вообще без сервера kexify. Открытый CLI делает то же самое или превращает два файла в обычный приватный ключ."

dev:
  title: "Для разработчиков"
  intro: "Режим эксперта бесплатный и по умолчанию выключен. Включите его в настройках, когда понадобятся расширенные возможности."
  more: "Руководство для разработчиков"
  items:
    - title: "WalletConnect v2"
      body: "Ethereum и EVM L2 (<code>eth_sendTransaction</code>, <code>personal_sign</code>, <code>eth_signTypedData_v4</code>), Solana и TRON."
    - title: "Тестовые сети"
      body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile и Shasta, Bitcoin testnet, Cardano PreProd и другие, одним переключателем в режиме эксперта."
    - title: "Режим эксперта"
      body: "Свой nonce и комиссии, выбор UTXO, ускорение через RBF для BTC и LTC, подпись сырых сообщений, режим «только подпись» с отдельной отправкой в сеть."
    - title: "Свой RPC"
      body: "Замените RPC и обозреватель любой сети на свой адрес Alchemy, Infura или QuickNode, с проверкой доступности в реальном времени. Всю конфигурацию можно править как JSON."
    - title: "CLI и восстановление"
      body: "CLI на Bun собирает ключи из двух файлов ключа (<code>recover</code>) или подписывает запросы WalletConnect локально (<code>connect</code>)."
    - title: "Открытый код"
      body: 'Веб-приложение под лицензией MIT на <a href="https://github.com/nguyenkha/kexify-web" class="text-blue-400 hover:text-blue-300">GitHub</a>. MPC работает на <a href="https://github.com/coinbase/cb-mpc" class="text-blue-400 hover:text-blue-300">Coinbase cb-mpc</a> через <a href="https://github.com/nguyenkha/cb-mpc" class="text-blue-400 hover:text-blue-300">наш форк</a>.'

chains:
  title: "Поддерживаемые сети"
  evm_sub: "Ethereum, Base, Arbitrum, Polygon..."
  more: "Ещё"
  more_sub: "TRON, Algorand, Cardano, Stellar, LTC, BCH"

plans:
  title: "Бесплатно и Premium"
  free_title: "Бесплатно"
  free_price: "$0, навсегда"
  free_items:
    - "Всё, что описано выше"
    - "Дневной лимит, доверенные адреса, ожидание при превышении лимита"
    - "Блокировка безлимитных разрешений и проверка рискованных адресов"
    - "Заморозка, набор для резервной копии, режим восстановления, CLI"
    - "WalletConnect и режим эксперта"
    - "Приложение для iPhone (скоро)"
    - "Предпросмотр изменения баланса перед подписью (скоро)"
  premium_title: "Premium"
  premium_price: "Цена скоро будет объявлена"
  premium_note: "Планируется, пока не сделано. Базовая защита никогда не станет платной."
  premium_items:
    - "iPhone как устройство подтверждения"
    - "Офлайн-подпись по QR"
    - "Свои правила и ожидание для крупных сумм"
    - "Расширенная симуляция с проверкой рисков"
    - "Мгновенные оповещения и автоматическое повышение комиссии"
    - "Больше отдельных кошельков"
  planned: "планируется"

why:
  title: "Почему kexify"
  items:
    - title: "в отличие от кошельков с seed-фразой"
      body: "Один секрет на одном устройстве. Если он утёк, всё потеряно. В kexify утечка одной лишь части ключа с устройства не позволяет перевести средства."
    - title: "в отличие от кастодиальных приложений"
      body: "Нет ключей, нет и крипты. В kexify вы можете забрать оба файла ключа и подписывать без нас."
    - title: "в отличие от других MPC-кошельков"
      body: "Ваши правила применяет соподписант, а ваш выход не зависит от нашего сервера."

cta:
  title: "Сначала попробуйте на небольшой сумме"
  body: "kexify это личный проект одного инженера, он предоставляется «как есть». Начните с малого, прочитайте FAQ и двигайтесь дальше."
  app: "Открыть веб-приложение"
  github: "Смотреть на GitHub"
