# Тексты главной страницы (ru). Те же ключи, что в en.yml; _includes/home.html их выводит.
hero:
  tagline: "Криптокошелёк со страховкой."
  sub: "Без seed-фразы. Ваш ключ разделён между вашим устройством и сервером kexify, а сервер проверяет ваши правила, прежде чем подписать вместе с вами."
  stats: ["Более 20 сетей", "MPC 2-of-2", "0 seed-фраз"]
  cta_app: "Открыть веб-приложение"
  cta_dev: "Для разработчиков"
  ios_note: "Пользоваться бесплатно. Приложение для iPhone в тестировании; веб-приложение работает уже сейчас."
  move_title: "kexify переехал с kexify.co на kexify.app"
  move_body: 'Новые кошельки создавайте на <a href="https://my.kexify.app/" class="text-blue-400 hover:underline">my.kexify.app</a>. Кошельки на <a href="https://app.kexify.co/" class="text-blue-400 hover:underline">app.kexify.co</a> продолжают работать там, но автоматически перенести их нельзя (passkey привязаны к домену), поэтому создайте новый кошелёк и переведите туда средства.'
  move_warning: "kexify никогда не попросит ваш файл ключа или парольную фразу по почте, в чате или через поддержку."

safety:
  title: "Безопасно по умолчанию"
  intro: "Правила применяет сервер, поэтому украденный ноутбук или плохая ссылка их не обойдут."
  items:
    - icon: key
      title: "Нет seed-фразы, которую можно потерять"
      body: "Одна часть ключа на вашем устройстве, другая на сервере; по отдельности они не подписывают."
    - icon: limit
      title: "Дневной лимит под вашим контролем"
      body: "Сверх вашего лимита в USD отправка блокируется или ждёт 1 или 24 часа."
    - icon: clock
      title: "Изменения правил ждут 24 часа"
      body: "Более строгие правила действуют сразу, более мягкие ждут; заморозить кошелёк можно одним нажатием."
    - icon: shield
      title: "Безлимитные разрешения заблокированы"
      body: "kexify не соподпишет безлимитное разрешение на токен; вы задаёте лимит."
    - icon: eye
      title: "Видно, что вы подписываете"
      body: "Понятное описание операции и проверка по известным мошенническим адресам."
    - icon: exit
      title: "Уйти можно в любой момент"
      body: "С обоими файлами ключа можно подписывать в браузере или через CLI, сервер не нужен."

how:
  title: "Как это работает"
  intro: "У вашего устройства и сервера по одной части ключа, они подписывают вместе; полного ключа не существует."
  steps:
    - title: "Создание"
      body: "Две части ключа создаются вместе. Единого приватного ключа нет."
    - title: "Хранение"
      body: "Одна часть на вашем устройстве, другая на сервере, обе зашифрованы."
    - title: "Подпись"
      body: "Сервер проверяет ваши правила, затем обе стороны подписывают вместе."
  browser: "Ваше устройство"
  server: "Сервер"
  share_a: "Часть ключа A"
  share_b: "Часть ключа B"
  tip_a: "Зашифрована на вашем устройстве (AES-GCM)"
  tip_b: "Зашифрована на сервере (AES-256-GCM + HKDF)"
  channel: "зашифрованные сообщения, а не ключи"
  signature: "Подпись"

dev:
  title: "Для разработчиков"
  intro: "Режим эксперта бесплатный и по умолчанию выключен; включите его в настройках."
  more: "Руководство для разработчиков"
  items:
    - title: "WalletConnect v2"
      body: "Подключайте dApp в сетях EVM, Solana и TRON."
    - title: "Тестовые сети"
      body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile и другие."
    - title: "Режим эксперта"
      body: "Свой nonce и комиссии, выбор UTXO, свой RPC."
    - title: "Восстановление и CLI"
      body: "Соберите ключи или подпишите локально из двух файлов ключа."
    - title: "Открытый код"
      body: 'Веб-приложение и CLI под MIT, MPC из <a href="https://github.com/nguyenkha/cb-mpc" class="text-blue-400 hover:text-blue-300">cb-mpc</a>.'
    - title: "API для разработчиков"
      body: "Скоро: API только для чтения, SDK для подписи и вебхуки."

chains:
  title: "Поддерживаемые сети"
  evm_sub: "Ethereum, Base, Arbitrum, Polygon..."
  more: "Ещё"
  more_sub: "TRON, Algorand, Cardano, Stellar, LTC, BCH, DOGE"

plans:
  title: "Бесплатно и Premium"
  intro: "Базовая защита бесплатна и никогда не станет платной."
  free_title: "Бесплатно"
  free_price: "$0, навсегда"
  free_items:
    - "Дневной лимит, доверенные адреса и проверки безопасности"
    - "Набор для восстановления, режим восстановления и CLI"
    - "WalletConnect, режим эксперта и тестовые сети"
    - "Синхронизация зашифрованной адресной книги"
  premium_title: "Premium"
  premium_price: "Скоро"
  premium_items:
    - "iPhone как устройство подтверждения, подпись air-gapped"
    - "Мгновенные оповещения и автоматическое повышение комиссии"
    - "Адреса приватности для Bitcoin, больше субаккаунтов"
    - "SDK для подписи и вебхуки для разработчиков"

cta:
  title: "Сначала попробуйте на небольшой сумме"
  body: "kexify — это личный проект одного инженера, он предоставляется «как есть»."
  app: "Открыть веб-приложение"
  github: "Смотреть на GitHub"
