# होम पेज की कॉपी (हिन्दी)। en.yml जैसी ही कुंजियाँ; _includes/home.html इसे रेंडर करता है।
hero:
  tagline: "सेफ़्टी नेट वाला क्रिप्टो वॉलेट।"
  sub: "कोई सीड फ़्रेज़ नहीं। आपकी कुंजी आपके डिवाइस और kexify सर्वर के बीच बँटी रहती है, और साथ में साइन करने से पहले सर्वर आपके नियम जाँचता है।"
  stats: ["20+ नेटवर्क", "2-of-2 MPC", "0 सीड फ़्रेज़"]
  cta_app: "वेब ऐप खोलें"
  cta_dev: "डेवलपर के लिए"
  ios_note: "इस्तेमाल मुफ़्त है। iPhone ऐप टेस्टिंग में है; वेब ऐप अभी काम कर रहा है।"
  move_title: "kexify kexify.co से kexify.app पर आ गया है"
  move_body: 'नए वॉलेट <a href="https://my.kexify.app/" class="text-blue-400 hover:underline">my.kexify.app</a> पर बनाएँ। <a href="https://app.kexify.co/" class="text-blue-400 hover:underline">app.kexify.co</a> के वॉलेट वहाँ चलते रहेंगे, लेकिन अपने आप यहाँ नहीं आ सकते (पासकी डोमेन से जुड़ी होती हैं), इसलिए नया वॉलेट बनाएँ और अपना फ़ंड वहाँ भेज दें।'
  move_warning: "kexify आपकी कुंजी फ़ाइल या पासफ़्रेज़ कभी ईमेल, चैट या सपोर्ट पर नहीं माँगेगा।"

safety:
  title: "शुरू से सुरक्षित"
  intro: "नियम सर्वर लागू करता है, इसलिए चोरी हुआ लैपटॉप या कोई खराब लिंक उन्हें लाँघ नहीं सकता।"
  items:
    - icon: key
      title: "खोने के लिए कोई सीड फ़्रेज़ नहीं"
      body: "एक कुंजी शेयर आपके डिवाइस पर, एक सर्वर पर; कोई भी अकेले साइन नहीं करता।"
    - icon: limit
      title: "रोज़ की सीमा, जो आपके हाथ में है"
      body: "आपकी USD सीमा से ऊपर भेजना रुक जाता है या 1 या 24 घंटे इंतज़ार करता है।"
    - icon: clock
      title: "नियम बदलने पर 24 घंटे का इंतज़ार"
      body: "सख़्त नियम तुरंत लागू होते हैं; ढीले नियम इंतज़ार करते हैं, और आप एक क्लिक में फ़्रीज़ कर सकते हैं।"
    - icon: shield
      title: "अनलिमिटेड अप्रूवल पर रोक"
      body: "kexify अनलिमिटेड टोकन अप्रूवल पर साइन नहीं करता; आप सीमा तय करते हैं।"
    - icon: eye
      title: "जो साइन कर रहे हैं, वह दिखता है"
      body: "आसान शब्दों में समीक्षा, साथ में जाने-पहचाने स्कैम पतों की जाँच।"
    - icon: exit
      title: "जब चाहें निकलें"
      body: "दोनों कुंजी फ़ाइलों से आप ब्राउज़र या CLI में साइन कर सकते हैं, सर्वर की ज़रूरत नहीं।"

how:
  title: "यह कैसे काम करता है"
  intro: "आपका डिवाइस और सर्वर, दोनों के पास एक-एक कुंजी शेयर है और वे साथ में साइन करते हैं; पूरी कुंजी कभी बनती ही नहीं।"
  steps:
    - title: "बनाएँ"
      body: "दो कुंजी शेयर एक साथ बनते हैं। कोई एक प्राइवेट की नहीं बनती।"
    - title: "सहेजें"
      body: "एक शेयर आपके डिवाइस पर, एक सर्वर पर, दोनों एन्क्रिप्टेड।"
    - title: "साइन करें"
      body: "सर्वर आपके नियम जाँचता है, फिर दोनों पक्ष मिलकर साइन करते हैं।"
  browser: "आपका डिवाइस"
  server: "सर्वर"
  share_a: "कुंजी शेयर A"
  share_b: "कुंजी शेयर B"
  tip_a: "आपके डिवाइस पर एन्क्रिप्टेड (AES-GCM)"
  tip_b: "सर्वर पर एन्क्रिप्टेड (AES-256-GCM + HKDF)"
  channel: "एन्क्रिप्टेड संदेश, कुंजियाँ नहीं"
  signature: "सिग्नेचर"

dev:
  title: "डेवलपर के लिए"
  intro: "एक्सपर्ट मोड मुफ़्त है और डिफ़ॉल्ट रूप से बंद रहता है; सेटिंग में चालू करें।"
  more: "डेवलपर गाइड पढ़ें"
  items:
    - title: "WalletConnect v2"
      body: "EVM चेन, Solana और TRON पर dApp जोड़ें।"
    - title: "टेस्टनेट"
      body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile और भी।"
    - title: "एक्सपर्ट मोड"
      body: "nonce और फ़ीस ओवरराइड, UTXO चयन, आपका अपना RPC।"
    - title: "रिकवरी और CLI"
      body: "दो कुंजी फ़ाइलों से कुंजी दोबारा बनाएँ या लोकल में साइन करें।"
    - title: "ओपन सोर्स"
      body: 'MIT वेब ऐप और CLI, MPC <a href="https://github.com/nguyenkha/cb-mpc" class="text-blue-400 hover:text-blue-300">cb-mpc</a> से।'
    - title: "डेवलपर API"
      body: "जल्द आ रहा है: रीड-ओनली API, API प्रपोज़ल जिन्हें आप अपने iPhone पर अप्रूव करते हैं, और वेबहुक।"

