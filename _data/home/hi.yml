why:
  title: "kexify क्यों"
  items:
    - title: "सीड-फ़्रेज़ वॉलेट के मुक़ाबले"
      body: "एक डिवाइस पर एक ही राज़। वह लीक हो जाए तो सब कुछ चला जाता है। kexify में सिर्फ़ डिवाइस की शेयर लीक होने से फ़ंड नहीं हिल सकता।"
    - title: "कस्टोडियल ऐप के मुक़ाबले"
      body: "कुंजी आपकी नहीं, तो क्रिप्टो भी आपका नहीं। kexify में आप दोनों कुंजी फ़ाइलें लेकर हमारे बिना साइन कर सकते हैं।"
    - title: "दूसरे MPC वॉलेट के मुक़ाबले"
      body: "आपके नियम साथ में साइन करने वाला सर्वर लागू करता है, और आपका बाहर निकलना हमारे सर्वर पर निर्भर नहीं है।"

cta:
  title: "पहले थोड़ी रकम से आज़माएँ"
  body: "kexify एक इंजीनियर का निजी प्रोजेक्ट है, जैसा है वैसा ही दिया जाता है। छोटी शुरुआत करें, FAQ पढ़ें, फिर आगे बढ़ें।"
  app: "वेब ऐप खोलें"
  github: "GitHub पर देखें"
