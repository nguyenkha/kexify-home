# Home page copy (Hindi). Same keys as en.yml.
hero:
  tagline: "सेफ़्टी नेट वाला क्रिप्टो वॉलेट।"
  sub: "कोई सीड फ़्रेज़ नहीं। आपकी कुंजी आपके डिवाइस और kexify सर्वर के बीच बँटी रहती है, और साथ में साइन करने से पहले सर्वर आपके खुद के नियम जाँचता है।"
  stats: ["20+ नेटवर्क", "2-of-2 MPC", "0 सीड फ़्रेज़"]
  cta_app: "वेब ऐप खोलें"
  cta_dev: "डेवलपर के लिए"
  ios_note: "इस्तेमाल मुफ़्त है। iPhone ऐप टेस्टिंग में है; वेब ऐप आज से काम करता है।"
  move_title: "kexify kexify.co से kexify.app पर आ गया है"
  move_body: 'नए वॉलेट <a href="https://my.kexify.app/" class="text-blue-400 hover:underline">my.kexify.app</a> पर बनते हैं। अगर आपका वॉलेट पहले से <a href="https://app.kexify.co/" class="text-blue-400 hover:underline">app.kexify.co</a> पर है, तो वह वहाँ चलता रहेगा, लेकिन उसे अपने आप यहाँ नहीं लाया जा सकता: पासकी उसी डोमेन से जुड़ी होती हैं जहाँ वे बनी थीं। आने के लिए my.kexify.app पर नया वॉलेट बनाएँ और अपना फ़ंड वहाँ भेज दें। ब्योरे के लिए app.kexify.co में साइन इन करें।'
  move_warning: "kexify आपकी कुंजी फ़ाइल या पासफ़्रेज़ कभी ईमेल, चैट या सपोर्ट पर नहीं माँगेगा।"

safety:
  title: "शुरू से सुरक्षित"
  intro: "उन लोगों के लिए बना है जो क्रिप्टो में नए हैं। नए लोगों की आम गलतियाँ रोक दी जाती हैं या धीमी कर दी जाती हैं, और नियम सर्वर लागू करता है, इसलिए चोरी हुआ लैपटॉप या कोई खराब लिंक उन्हें लाँघ नहीं सकता।"
  items:
    - icon: key
      title: "खोने के लिए कोई सीड फ़्रेज़ नहीं"
      body: "दो कुंजी शेयर, एक आपके डिवाइस पर और एक सर्वर पर। कोई भी अकेले साइन नहीं कर सकती। पासफ़्रेज़ जाँच वाला बैकअप किट आपकी शेयर को सुरक्षित रखता है।"
    - icon: limit
      title: "रोज़ की सीमा, जो आपके हाथ में है"
      body: "रोज़ की USD सीमा तय करें और सिर्फ़ भरोसेमंद पतों पर भेजने की अनुमति दें। सीमा के ऊपर भेजना रुक जाता है या 1 या 24 घंटे इंतज़ार करता है।"
    - icon: clock
      title: "नियम बदलने पर 24 घंटे का इंतज़ार"
      body: "सख़्त नियम तुरंत लागू होते हैं। ढीले नियम 24 घंटे इंतज़ार करते हैं, ताकि अंदर घुसा कोई व्यक्ति उन्हें तुरंत बंद न कर सके। अपना वॉलेट एक क्लिक में फ़्रीज़ करें।"
    - icon: shield
      title: "अनलिमिटेड अप्रूवल पर रोक"
      body: "dApp अक्सर किसी टोकन को हमेशा के लिए पूरा खर्च करने की अनुमति माँगते हैं। kexify उस पर साथ में साइन करने से मना करता है; आप उसकी जगह सीमा तय करते हैं।"
    - icon: alert
      title: "जोखिम वाले पते की जाँच"
      body: "साइन करने से पहले पाने वाले का पता GoPlus Security की स्कैम और फ़िशिंग पतों की सूची में जाँचा जाता है। नए पाने वाले पर भी चेतावनी मिलती है।"
    - icon: eye
      title: "जो साइन कर रहे हैं, वह दिखता है"
      body: "ट्रांसफ़र, टोकन अप्रूवल, permit और typed data पुष्टि से पहले आसान शब्दों में दिखते हैं, पूरे पते और रकम के साथ।"

how:
  title: "यह कैसे काम करता है"
  steps:
    - title: "बनाएँ"
      body: "दो स्वतंत्र कुंजी शेयर एक साथ बनती हैं। कोई एक प्राइवेट की कभी बनती ही नहीं।"
    - title: "सहेजें"
      body: "एक शेयर आपके डिवाइस पर रहती है, एक सर्वर पर। दोनों एन्क्रिप्टेड हैं।"
    - title: "साइन करें"
      body: "आपका डिवाइस और सर्वर मिलकर साइन करते हैं। सर्वर पहले आपके नियम जाँचता है और अकेले साइन नहीं कर सकता।"
  mpc_title: "MPC साइनिंग"
  browser: "आपका डिवाइस"
  server: "सर्वर"
  share_a: "कुंजी शेयर A"
  share_b: "कुंजी शेयर B"
  tip_a: "आपके डिवाइस पर एन्क्रिप्टेड (AES-GCM)"
  tip_b: "सर्वर पर एन्क्रिप्टेड (AES-256-GCM + HKDF)"
  channel: "एन्क्रिप्टेड संदेश, कुंजियाँ नहीं"
  signature: "सिग्नेचर"
  never: 'पूरी कुंजी <span class="text-blue-400">कभी बनती ही नहीं</span>: न आपके डिवाइस पर, न सर्वर पर, न रास्ते में।'

exit:
  title: "जब चाहें निकलें, सर्वर की ज़रूरत नहीं"
  body: "अपनी कुंजी फ़ाइल अपने पास रखें, और एक्सपर्ट मोड में सर्वर की कुंजी फ़ाइल भी माँगें (सुरक्षा के लिए इंतज़ार के बाद खुलती है)। दोनों फ़ाइलें होने पर रिकवरी मोड आपके ब्राउज़र में बिना किसी kexify सर्वर के साइन करता है। ओपन सोर्स CLI भी यही कर सकता है, या दोनों फ़ाइलों को सामान्य प्राइवेट की में बदल सकता है।"

dev:
  title: "डेवलपर के लिए"
  intro: "एक्सपर्ट मोड मुफ़्त है और डिफ़ॉल्ट रूप से बंद रहता है। ज़्यादा कंट्रोल चाहिए तो सेटिंग में चालू करें।"
  more: "डेवलपर गाइड पढ़ें"
  items:
    - title: "WalletConnect v2"
      body: "Ethereum और EVM L2 (<code>eth_sendTransaction</code>, <code>personal_sign</code>, <code>eth_signTypedData_v4</code>), Solana और TRON।"
    - title: "टेस्टनेट"
      body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile और Shasta, Bitcoin testnet, Cardano PreProd और भी, एक्सपर्ट मोड में एक टॉगल से।"
    - title: "एक्सपर्ट मोड"
      body: "nonce और फ़ीस ओवरराइड, UTXO चयन, BTC और LTC के लिए RBF स्पीड-अप, रॉ मैसेज साइनिंग, अलग ब्रॉडकास्ट के साथ सिर्फ़-साइन।"
    - title: "आपका अपना RPC"
      body: "किसी भी चेन का RPC और एक्सप्लोरर अपने Alchemy, Infura या QuickNode एंडपॉइंट से बदलें, लाइव हेल्थ चेक के साथ। पूरा कॉन्फ़िग JSON में एडिट करें।"
    - title: "CLI और रिकवरी"
      body: "एक Bun CLI दो कुंजी फ़ाइलों से कुंजी दोबारा बनाता है (<code>recover</code>) या WalletConnect रिक्वेस्ट लोकल में साइन करता है (<code>connect</code>)।"
    - title: "ओपन सोर्स"
      body: 'वेब ऐप <a href="https://github.com/nguyenkha/kexify-web" class="text-blue-400 hover:text-blue-300">GitHub</a> पर MIT है। MPC <a href="https://github.com/coinbase/cb-mpc" class="text-blue-400 hover:text-blue-300">Coinbase cb-mpc</a> पर चलता है, <a href="https://github.com/nguyenkha/cb-mpc" class="text-blue-400 hover:text-blue-300">हमारे फ़ोर्क</a> के ज़रिए।'

