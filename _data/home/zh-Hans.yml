why:
  title: "为什么选择 kexify"
  items:
    - title: "对比助记词钱包"
      body: "一个秘密放在一台设备上，一旦泄露，一切都没了。用 kexify，单单泄露设备上的分片，无法转走资金。"
    - title: "对比托管类应用"
      body: "不是你的密钥，就不是你的币。用 kexify，你可以拿走两个密钥文件，不依赖我们也能签名。"
    - title: "对比其他 MPC 钱包"
      body: "你的规则由共同签名方执行，而且你的退出路径不依赖我们的服务器。"

