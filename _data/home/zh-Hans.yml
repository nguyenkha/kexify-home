hero:
  tagline: "有安全网的加密钱包。"
  sub: "没有助记词。你的密钥被拆分在你的设备和 kexify 服务器之间，服务器在共同签名前会先检查你的规则。"
  stats: ["20+ 个网络", "2-of-2 MPC", "0 个助记词"]
  cta_app: "打开网页版"
  cta_dev: "面向开发者"
  ios_note: "免费使用。iPhone 应用正在测试中；网页版现在就能用。"
  move_title: "kexify 已从 kexify.co 迁移到 kexify.app"
  move_body: '新钱包请在 <a href="https://my.kexify.app/" class="text-blue-400 hover:underline">my.kexify.app</a> 创建。<a href="https://app.kexify.co/" class="text-blue-400 hover:underline">app.kexify.co</a> 上的钱包仍可在那里继续使用，但无法自动迁移（通行密钥绑定在域名上），所以请创建新钱包，再把资金转过去。'
  move_warning: "kexify 绝不会通过邮件、聊天或客服向你索要密钥文件或口令。"

safety:
  title: "默认就安全"
  intro: "规则由服务器执行，所以被盗的电脑或一个恶意链接也绕不过去。"
  items:
    - icon: key
      title: "没有助记词可丢"
      body: "一份密钥分片在你的设备上，一份在服务器上；任何一方都无法单独签名。"
    - icon: limit
      title: "由你掌控的每日限额"
      body: "超过你设定的美元限额，转账会被拦截，或需等待 1 小时或 24 小时。"
    - icon: clock
      title: "规则变更需等待 24 小时"
      body: "更严格的规则立即生效；更宽松的要等待，你也可以一键冻结。"
    - icon: shield
      title: "拦截无限授权"
      body: "kexify 不会共同签名无限额度的代币授权；由你设定上限。"
    - icon: eye
      title: "看清你签的是什么"
      body: "用通俗的话展示交易，并对照已知诈骗地址进行检查。"
    - icon: exit
      title: "随时离开"
      body: "有了两个密钥文件，你可以在浏览器或命令行中签名，无需服务器。"

how:
  title: "工作原理"
  intro: "你的设备和服务器各持一份密钥分片并共同签名；完整的密钥从不存在。"
  steps:
    - title: "创建"
      body: "两份密钥分片同时生成。不存在单一的私钥。"
    - title: "存储"
      body: "一份在你的设备上，一份在服务器上，都经过加密。"
    - title: "签名"
      body: "服务器先检查你的规则，然后双方共同签名。"
  browser: "你的设备"
  server: "服务器"
  share_a: "密钥分片 A"
  share_b: "密钥分片 B"
  tip_a: "在你的设备上加密（AES-GCM）"
  tip_b: "在服务器上加密（AES-256-GCM + HKDF）"
  channel: "传输的是加密消息，不是密钥"
  signature: "签名"

