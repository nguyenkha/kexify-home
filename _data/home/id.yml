# Teks halaman utama (id). Kunci sama dengan en.yml; dirender oleh _includes/home.html.
# Singkat: tiap bagian punya judul, satu kalimat, lalu kartu satu baris.
# Nilai boleh berisi HTML inline (tautan, <code>). Setiap klaim harus benar di aplikasi web yang dirilis;
# yang belum dibuat diberi label "segera hadir".
hero:
  tagline: "Dompet kripto dengan jaring pengaman."
  sub: "Tanpa frasa seed. Kunci Anda dibagi antara perangkat Anda dan server kexify, dan server memeriksa aturan Anda sebelum ikut menandatangani."
  stats: ["20+ jaringan", "MPC 2-of-2", "0 frasa seed"]
  cta_app: "Buka aplikasi web"
  cta_dev: "Untuk developer"
  ios_note: "Gratis dipakai. Aplikasi iPhone sedang diuji; aplikasi web sudah berfungsi sekarang."
  move_title: "kexify pindah dari kexify.co ke kexify.app"
  move_body: 'Buat dompet baru di <a href="https://my.kexify.app/" class="text-blue-400 hover:underline">my.kexify.app</a>. Dompet di <a href="https://app.kexify.co/" class="text-blue-400 hover:underline">app.kexify.co</a> tetap berfungsi di sana, tetapi tidak bisa dipindahkan otomatis (passkey terikat pada domain), jadi buat dompet baru lalu kirim dana Anda ke sana.'
  move_warning: "kexify tidak akan pernah meminta file kunci atau frasa sandi Anda lewat email, chat, atau dukungan."
  move_close: "Tutup pemberitahuan"

safety:
  title: "Aman sejak awal"
  intro: "Server menegakkan aturan Anda, jadi laptop yang dicuri atau tautan berbahaya tidak bisa melewatinya."
  items:
    - icon: key
      title: "Tidak ada frasa seed yang bisa hilang"
      body: "Satu bagian kunci di perangkat Anda, satu di server; tidak ada yang menandatangani sendirian."
    - icon: limit
      title: "Batas harian yang Anda kendalikan"
      body: "Di atas batas USD Anda, pengiriman diblokir atau menunggu 1 atau 24 jam."
    - icon: clock
      title: "Perubahan aturan menunggu 24 jam"
      body: "Aturan yang lebih ketat berlaku seketika; yang lebih longgar menunggu, dan Anda bisa membekukan dengan satu klik."
    - icon: shield
      title: "Persetujuan tak terbatas diblokir"
      body: "kexify tidak ikut menandatangani persetujuan token tak terbatas; Anda menetapkan batas."
    - icon: eye
      title: "Lihat apa yang Anda tandatangani"
      body: "Ringkasan dengan kata-kata sederhana, plus pemeriksaan terhadap alamat penipuan yang dikenal."
    - icon: exit
      title: "Keluar kapan saja"
      body: "Dengan kedua file kunci, Anda bisa menandatangani di browser atau CLI, tanpa server."

how:
  title: "Cara kerjanya"
  intro: "Perangkat Anda dan server masing-masing memegang satu bagian kunci dan menandatangani bersama; kunci utuh tidak pernah ada."
  steps:
    - title: "Buat"
      body: "Dua bagian kunci dibuat bersamaan. Tidak ada satu kunci privat utuh."
    - title: "Simpan"
      body: "Satu bagian di perangkat Anda, satu di server, keduanya terenkripsi."
    - title: "Tandatangani"
      body: "Server memeriksa aturan Anda, lalu kedua pihak menandatangani bersama."
  browser: "Perangkat Anda"
  server: "Server"
  share_a: "Bagian kunci A"
  share_b: "Bagian kunci B"
  tip_a: "Terenkripsi di perangkat Anda (AES-GCM)"
  tip_b: "Terenkripsi di server (AES-256-GCM + HKDF)"
  channel: "pesan terenkripsi, bukan kunci"
  signature: "Tanda tangan"

dev:
  title: "Untuk developer"
  intro: "Mode Ahli gratis dan nonaktif secara default; aktifkan di Pengaturan."
  more: "Baca panduan developer"
  items:
    - title: "WalletConnect v2"
      body: "Hubungkan dApp di chain EVM, Solana, dan TRON."
    - title: "Jaringan uji"
      body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile, dan lainnya."
    - title: "Mode Ahli"
      body: "Nonce dan biaya kustom, pemilihan UTXO, RPC milik Anda sendiri."
    - title: "Pemulihan dan CLI"
      body: "Bangun kembali kunci atau tandatangani secara lokal dari kedua file kunci."
    - title: "Open source"
      body: 'Aplikasi web dan CLI berlisensi MIT, MPC dari <a href="https://github.com/nguyenkha/cb-mpc" class="text-blue-400 hover:text-blue-300">cb-mpc</a>.'
    - title: "API developer"
      body: "Segera hadir: API hanya-baca, proposal API yang Anda setujui di iPhone, dan webhook."

