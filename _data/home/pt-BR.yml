      body: "Conecte dApps em redes EVM, Solana e TRON."
    - title: "Redes de teste"
      body: "Sepolia, Base Sepolia, Solana devnet, TRON Nile e mais."
    - title: "Modo especialista"
      body: "Nonce e taxas personalizados, seleção de UTXO, seu próprio RPC."
    - title: "Recuperação e CLI"
      body: "Reconstrua chaves ou assine localmente com os dois arquivos de chave."
    - title: "Código aberto"
      body: 'App web e CLI com licença MIT, MPC do <a href="https://github.com/nguyenkha/cb-mpc" class="text-blue-400 hover:text-blue-300">cb-mpc</a>.'
    - title: "API para desenvolvedores"
      body: "Em breve: API somente leitura, propostas via API que você aprova no iPhone e webhooks."

