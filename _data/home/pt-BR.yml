# Texto da página inicial (pt-BR). Um arquivo por idioma (mesmas chaves); _includes/home.html exibe.
# Curto: cada seção é um título, uma frase e cartões de uma linha.
# Os valores podem ter HTML em linha (links, <code>). Toda afirmação deve ser verdadeira no app web publicado;
# o que ainda não foi construído é marcado como "em breve".
hero:
  tagline: "Uma carteira cripto com rede de proteção."
  sub: "Sem frase-semente. Sua chave é dividida entre o seu dispositivo e o servidor do kexify, e o servidor confere as suas regras antes de co-assinar."
  stats: ["Mais de 20 redes", "MPC 2-of-2", "0 frases-semente"]
  cta_app: "Abrir o app web"
  cta_dev: "Para desenvolvedores"
  ios_note: "Uso grátis. App para iPhone em testes; o app web funciona hoje."
  move_title: "O kexify mudou de kexify.co para kexify.app"
  move_body: 'Crie carteiras novas em <a href="https://my.kexify.app/" class="text-blue-400 hover:underline">my.kexify.app</a>. As carteiras de <a href="https://app.kexify.co/" class="text-blue-400 hover:underline">app.kexify.co</a> continuam funcionando lá, mas não dá para migrar automaticamente (as passkeys são ligadas ao domínio), então crie uma carteira nova e envie seus fundos.'
  move_warning: "O kexify nunca vai pedir seu arquivo de chave nem sua frase-senha por e-mail, chat ou suporte."

safety:
  title: "Seguro por padrão"
  intro: "O servidor aplica as suas regras, então um notebook roubado ou um link malicioso não conseguem pular essas regras."
  items:
    - icon: key
      title: "Sem frase-semente para perder"
      body: "Uma parte da chave no seu dispositivo e outra no servidor; nenhuma assina sozinha."
    - icon: limit
      title: "Um limite diário que você controla"
      body: "Acima do seu limite em USD, o envio é bloqueado ou espera 1 ou 24 horas."
    - icon: clock
      title: "Mudanças de regra esperam 24 horas"
      body: "Regras mais rígidas valem na hora; as mais frouxas esperam, e você pode congelar com um clique."
    - icon: shield
      title: "Aprovações ilimitadas bloqueadas"
      body: "O kexify não co-assina uma aprovação ilimitada de token; você define um teto."
    - icon: eye
      title: "Veja o que você assina"
      body: "Revisão em linguagem simples e verificação contra endereços de golpe conhecidos."
    - icon: exit
      title: "Saia quando quiser"
      body: "Com os dois arquivos de chave você assina no navegador ou na CLI, sem servidor."

how:
  title: "Como funciona"
  intro: "Seu dispositivo e o servidor guardam cada um uma parte da chave e assinam juntos; a chave completa nunca existe."
  steps:
    - title: "Criar"
      body: "Duas partes de chave são criadas juntas. Não existe uma única chave privada."
    - title: "Guardar"
      body: "Uma parte no seu dispositivo e outra no servidor, ambas criptografadas."
    - title: "Assinar"
      body: "O servidor confere suas regras e depois os dois assinam juntos."
  browser: "Seu dispositivo"
  server: "Servidor"
  share_a: "Parte da chave A"
  share_b: "Parte da chave B"
  tip_a: "Criptografada no seu dispositivo (AES-GCM)"
  tip_b: "Criptografada no servidor (AES-256-GCM + HKDF)"
  channel: "mensagens criptografadas, não chaves"
  signature: "Assinatura"

dev:
  title: "Para desenvolvedores"
  intro: "O modo especialista é grátis e vem desligado; ative nos Ajustes."
  more: "Ler o guia para desenvolvedores"
  items:
