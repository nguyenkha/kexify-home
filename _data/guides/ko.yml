# Short developer guides at /developers/<guide>/. One file per language (same keys); _includes/guide.html renders it.
# About 5 steps each, no long prose. Only flows checked against the kexify code; limits are said plainly.
back: "개발자"

remix:
  title: "kexify로 Remix에서 배포하기"
  intro: "Remix는 WalletConnect로 kexify에 연결되므로 브라우저 확장 프로그램 없이 컨트랙트를 배포하고 호출할 수 있습니다."
  steps:
    - '<a href="https://remix.ethereum.org">Remix</a>를 열고 컨트랙트를 작성하거나 불러온 뒤 컴파일합니다.'
    - "Deploy &amp; run transactions에서 Environment를 WalletConnect로 설정하고 페어링 URI를 복사합니다(또는 QR 코드를 표시합니다)."
    - "kexify에서 WalletConnect를 열고 URI를 붙여 넣거나 코드를 스캔한 뒤 EVM 계정을 승인합니다."
    - "Remix에서 네트워크를 고릅니다(처음에는 Sepolia). 그런 다음 Deploy를 누르거나 함수를 호출합니다."
    - "kexify가 확인 화면을 엽니다. passkey 또는 암호 문구로 승인하면 기기와 서버가 함께 서명하고 Remix에 영수증이 표시됩니다."
  note: "설정에서 전문가 모드와 테스트 네트워크를 켜면 지갑에 테스트 네트워크가 표시됩니다. 보내는 금액에는 일일 한도가 적용됩니다."

foundry:
  title: "kexify로 Foundry와 Hardhat 사용하기"
  intro: "Foundry와 Hardhat에는 WalletConnect 서명 기능이 없으므로 로컬에서 빌드하고 테스트한 뒤, 프로젝트 폴더를 Remix와 공유해 Remix에서 배포합니다."
  steps:
    - "평소처럼 빌드하고 테스트합니다. <code>forge build</code>와 <code>forge test</code> (또는 <code>npx hardhat compile</code>과 <code>npx hardhat test</code>)."
    - "프로젝트 폴더를 Remix와 공유합니다. <code>npx @remix-project/remixd -s . --remix-ide https://remix.ethereum.org</code>"
    - "Remix에서 localhost 워크스페이스를 선택하고(Connect to localhost) 컨트랙트를 엽니다."
    - 'Remix에서 컴파일한 뒤 <a href="../remix/">Remix 가이드</a>와 같이 WalletConnect 환경으로 배포합니다.'
    - "읽기 전용 호출에는 <code>cast</code>나 Hardhat 스크립트를 쓰고, 트랜잭션은 Remix에서 보내 kexify가 서명하게 합니다."
  note: "kexify는 Foundry나 Hardhat의 서명자(예: <code>--account</code>나 개인 키)로는 쓸 수 없습니다. 또한 두 키 파일로 직접 복원하지 않는 한 원시 개인 키를 알려 주지 않습니다."

safe:
  title: "kexify를 Safe 소유자로 쓰기"
  intro: "Safe는 WalletConnect로 kexify에 연결됩니다. Safe 생성과 트랜잭션 실행은 지금 가능하지만, 오프체인 승인 서명은 아직 지원하지 않습니다."
  steps:
    - '<a href="https://app.safe.global">app.safe.global</a>을 열고 WalletConnect를 선택해 kexify와 페어링합니다(먼저 Sepolia로 시도해 보세요).'
    - "kexify 주소를 소유자로 해서 Safe를 만듭니다. kexify에서 확인하고 승인하는 일반 트랜잭션입니다."
    - "Safe에서 트랜잭션을 만듭니다. 예를 들어 Safe에서 토큰을 전송합니다."
    - "Execute를 선택합니다. 내 승인이 마지막으로 필요한 승인이면 Safe가 kexify가 서명하는 일반 트랜잭션으로 전송합니다."
    - "kexify에서 승인하고 Safe 트랜잭션이 실행됨으로 표시될 때까지 기다립니다."
  note: "kexify는 기본 규칙에서 오프체인 Safe 서명(Sign 버튼, EIP-712 SafeTx)을 거부합니다. 따라서 내 다음에 다른 소유자가 실행해야 하는 Safe는 아직 지원하지 않습니다. 1-of-1 Safe나 마지막으로 실행하는 소유자일 때는 동작합니다."
