title: kexify
description: "keys simplified — self-custodial MPC wallet"
url: "https://kexify.app"
baseurl: ""
permalink: pretty
markdown: kramdown

# Apple app-site-association (passkeys of the iOS app for the RP kexify.app): Jekyll skips dot dirs by default.
include:
  - .well-known


exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - plans
  - docs
  - .claude
  - .opencode
  - CLAUDE.md
  - AGENTS.md
  - release-manifest.json
  - .repomixignore
